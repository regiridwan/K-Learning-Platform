<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fase 4: Tata Bahasa Lanjutan - K-Learning Platform</title>
    <!-- Favicon / Logo Tab Browser (SVG Inline) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e11d48'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='white' font-size='60' font-family='sans-serif' font-weight='bold'>한</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"

    <style>
      :root {
        --bg-main: #f8fafc;
        --panel-bg: #ffffff;
        --primary: #1e293b;
        --accent: #e11d48;
        --border-color: #e2e8f0;
        --text-muted: #64748b;
        --text-main: #1e293b;
        --success: #16a34a;
        --success-bg: #f0fdf4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", "Noto Sans KR", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: var(--panel-bg);
        border-bottom: 1px solid var(--border-color);
        padding: 0 24px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--primary);
        text-decoration: none;
      }

      .brand-logo {
        background: var(--accent);
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      nav {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .nav-dropdown {
        padding: 6px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        background: white;
        color: var(--primary);
        outline: none;
        cursor: pointer;
      }

      .timer-widget {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f1f5f9;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
      }

      .timer-display {
        font-family: monospace;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--primary);
      }

      .timer-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .timer-btn.stop {
        background: var(--accent);
      }

      .workspace {
        display: flex;
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      .left-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-color);
        background: #ffffff;
        transition: all 0.3s ease;
      }

      .left-panel.hidden-modul {
        display: none !important;
      }

      .panel-header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f8fafc;
      }

      .pdf-container {
        flex: 1;
        background: #525659;
      }

      .pdf-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Panel Kanan (Kosakata) */
      .right-panel {
        width: 420px;
        background: var(--panel-bg);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .right-panel.collapsed {
        margin-right: -420px;
        opacity: 0;
        pointer-events: none;
      }

      .right-panel.fullscreen {
        width: 100% !important;
        flex: 1 !important;
      }

      .right-panel.fullscreen .vocab-list.grid-view {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        align-content: start;
        gap: 14px;
        padding: 20px 24px;
      }

      .vocab-header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f8fafc;
      }

      .vocab-title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .vocab-title {
        font-size: 1rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .control-btns {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .action-btn {
        font-size: 0.75rem;
        padding: 5px 10px;
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        color: var(--primary);
        transition: all 0.2s;
      }

      .action-btn:hover {
        background: var(--primary);
        color: white;
      }

      .toggle-panel-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .progress-container {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .progress-bar-bg {
        flex: 1;
        height: 6px;
        background: #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: var(--success);
        width: 0%;
        transition: width 0.3s ease;
      }

      .week-filter {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .week-btn {
        padding: 4px 12px;
        border: 1px solid var(--border-color);
        background: #ffffff;
        border-radius: 16px;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }

      .week-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .vocab-list {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Flashcard Quiz View Styles */
      .flashcard-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg-main);
      }

      .quiz-card {
        width: 100%;
        max-width: 500px;
        background: white;
        border: 2px solid var(--border-color);
        border-radius: 16px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        position: relative;
        transition: all 0.3s ease;
      }

      .quiz-card.memorized {
        border-color: #22c55e;
        background-color: var(--success-bg);
      }

      .quiz-counter {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .quiz-kr {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--primary);
      }

      .quiz-latin {
        font-size: 1.1rem;
        color: var(--accent);
        font-weight: 600;
        font-style: italic;
      }

      .quiz-id {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-main);
        padding: 12px 20px;
        background: #f1f5f9;
        border-radius: 8px;
        width: 100%;
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .quiz-nav-btns {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        width: 100%;
        max-width: 500px;
      }

      .quiz-nav-btn {
        flex: 1;
        padding: 12px;
        background: white;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        color: var(--primary);
        transition: all 0.2s;
      }

      .quiz-nav-btn:hover {
        background: var(--primary);
        color: white;
      }

      /* Card Kosakata Standard View */
      .vocab-card {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #ffffff;
        transition: all 0.2s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }

      .vocab-card.memorized {
        border-color: #86efac;
        background-color: var(--success-bg);
      }

      .vocab-content {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
        min-width: 0;
      }

      .vocab-kr-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .vocab-kr {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--primary);
        word-break: break-word;
      }

      .vocab-latin {
        font-size: 0.78rem;
        color: var(--accent);
        font-weight: 600;
        font-style: italic;
      }

      .vocab-id {
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-top: 1px;
      }

      .card-right-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .btn-audio-sm {
        background: #f1f5f9;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 0.75rem;
        cursor: pointer;
      }

      .blur-text {
        background: #cbd5e1;
        color: transparent !important;
        border-radius: 4px;
        user-select: none;
        display: inline-block;
        padding: 0 4px;
      }

      .item-toggle-btn,
      .memorize-btn {
        background: #f1f5f9;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.82rem;
        flex-shrink: 0;
        font-weight: 600;
      }

      .memorize-btn.done {
        background: #22c55e;
        color: white;
        border-color: #16a34a;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="welcome.html" class="brand">
        <div class="brand-logo">한</div>
        <span>K-Learning Platform</span>
      </a>
      <script src="kamus-widget.js"></script>

      <div class="timer-widget">
        <span
          style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600"
          >POMODORO</span
        >
        <div class="timer-display" id="timer">25:00</div>
        <button class="timer-btn" id="start-timer-btn" onclick="toggleTimer()">
          Start
        </button>
        <button
          class="timer-btn"
          onclick="resetTimer()"
          style="background: #cbd5e1; color: #334155"
        >
          Reset
        </button>
      </div>

      <nav>
        <select
          class="nav-dropdown"
          onchange="window.location.href = this.value"
        >
          <option value="hangeul.html">Hangeul</option>
          <option value="fase1.html">Fase 1: Fondasi</option>
          <option value="fase2.html">Fase 2: Perluasan</option>
          <option value="fase3.html">Fase 3: Kalimat Kompleks</option>
          <option value="fase4.html" selected>
            Fase 4: Tata Bahasa Lanjutan
          </option>
          <option value="fase5.html">Fase 5: Simulasi TOPIK I</option>
          <option value="fase6.html">Fase 6: Menengah Awal</option>
          <option value="fase7.html">Fase 7: TOPIK II</option>
          <option value="fase8.html">Fase 8: Dunia Kerja</option>
          <option value="fase9.html">Fase 9: Menuju Level 4</option>
          <option value="gabungan.html">Review Gabungan Fase 1-8</option>
        </select>
        <a href="welcome.html">Home</a>
      </nav>
    </header>

    <div class="workspace">
      <!-- Panel Kiri: Modul PDF Fase 4 -->
      <div class="left-panel" id="left-panel">
        <div class="panel-header">
          <span style="font-weight: 700; color: var(--primary)"
            >Fase 4: Tata Bahasa Lanjutan (Minggu 13 - 17)</span
          >
          <button
            class="toggle-panel-btn"
            onclick="toggleRightPanel()"
            id="toggle-panel-btn"
          >
            <span id="panel-btn-icon">📖</span>
            <span id="panel-btn-text">Tampilkan Kosakata</span>
          </button>
        </div>
        <div class="pdf-container">
          <iframe
            src="https://docs.google.com/viewer?url=https://k-learning-platform-by-regi.netlify.app/Modul_Bahasa_Korea_Fase4.pdf&embedded=true"
          ></iframe>
        </div>
      </div>

      <!-- Panel Kanan: Kosakata -->
      <div class="right-panel collapsed" id="right-panel">
        <div class="vocab-header">
          <div class="vocab-title-bar">
            <span class="vocab-title">
              <span>📚</span>
              <span id="vocab-view-title">Hafalan Kosakata</span>
            </span>
            <div class="control-btns">
              <button
                class="action-btn"
                onclick="toggleViewMode()"
                id="view-mode-btn"
              >
                🎴 Mode Flashcard
              </button>
              <button
                class="action-btn"
                onclick="toggleFullVocabMode()"
                id="full-vocab-btn"
              >
                ↔️ Focus Mode
              </button>
              <button
                class="action-btn"
                onclick="toggleHideAll()"
                id="hide-all-btn"
              >
                🙈 Sembunyi Semua
              </button>
              <button
                class="action-btn"
                onclick="toggleHideTarget()"
                id="hide-target-btn"
              >
                Mode:
                <span id="hide-mode-label" style="color: var(--accent)"
                  >Sembunyi ID</span
                >
              </button>
            </div>
          </div>

          <div class="progress-container">
            <span>Status Hafal:</span>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <span id="progress-text">0/0 (0%)</span>
          </div>

          <div class="week-filter" id="week-filter-container"></div>
        </div>

        <!-- Tampilan Daftar Keseluruhan Kata -->
        <div class="vocab-list grid-view" id="vocab-list"></div>

        <!-- Tampilan Kuis / Flashcard (Satu Kata) -->
        <div
          class="flashcard-container"
          id="flashcard-container"
          style="display: none"
        >
          <div class="quiz-card" id="quiz-card">
            <div class="quiz-counter" id="quiz-counter">KATA 1 DARI 20</div>

            <div style="display: flex; align-items: center; gap: 10px">
              <span class="quiz-kr" id="quiz-kr">옷</span>
              <button
                class="btn-audio-sm"
                onclick="speakCurrentQuiz()"
                style="font-size: 1rem; padding: 6px 10px"
              >
                🔊
              </button>
            </div>
            <div class="quiz-latin" id="quiz-latin">ot</div>

            <div class="quiz-id" id="quiz-id">
              <span id="quiz-id-text">Pakaian</span>
            </div>

            <div style="display: flex; gap: 10px; width: 100%; margin-top: 8px">
              <button
                class="action-btn"
                style="flex: 1; padding: 10px"
                onclick="toggleQuizAnswer()"
                id="quiz-toggle-ans-btn"
              >
                🙈 Sembunyikan Jawaban
              </button>
              <button
                class="memorize-btn"
                style="flex: 1; padding: 10px"
                onclick="toggleQuizMemorized()"
                id="quiz-memorize-btn"
              >
                🟩 Belum Hafal
              </button>
            </div>
          </div>

          <div class="quiz-nav-btns">
            <button class="quiz-nav-btn" onclick="prevQuizCard()">
              ⬅️ Sebelumnya
            </button>
            <button class="quiz-nav-btn" onclick="nextQuizCard()">
              Berikutnya ➡️
            </button>
          </div>
        </div>
      </div>
    </div>

          { kr: "배우다", latin: "bae-u-da", id: "Belajar (keterampilan)" },
          { kr: "처음", latin: "cheo-eum", id: "Pertama kali" },
          { kr: "경험", latin: "gyeong-heom", id: "Pengalaman" },
          { kr: "다시", latin: "da-si", id: "Lagi" },
          { kr: "준비", latin: "jun-bi", id: "Persiapan" },
          { kr: "빌리다", latin: "bil-li-da", id: "Meminjam" },
          { kr: "열다", latin: "yeol-da", id: "Membuka" },
        ],
        "Minggu 16": [
          { kr: "잘하다", latin: "jal-ha-da", id: "Pandai" },
          { kr: "진짜", latin: "jin-jja", id: "Beneran" },
          { kr: "못하다", latin: "mot-ha-da", id: "Tidak pandai" },
          { kr: "아마", latin: "a-ma", id: "Mungkin" },
          { kr: "시험", latin: "si-heom", id: "Ujian" },
          { kr: "꼭", latin: "kkok", id: "Pasti" },
          { kr: "눈", latin: "nun", id: "Salju, mata" },
          { kr: "제가", latin: "je-ga", id: "Saya (subjek)" },
          { kr: "정말", latin: "jeong-mal", id: "Sungguh" },
          { kr: "먼저", latin: "meon-jeo", id: "Duluan" },
        ],
        "Minggu 17": [
          { kr: "듣다", latin: "deut-da", id: "Mendengar" },
          { kr: "빠르다", latin: "ppa-reu-da", id: "Cepat" },
          { kr: "걷다", latin: "geot-da", id: "Berjalan" },
          { kr: "고르다", latin: "go-reu-da", id: "Memilih" },
          { kr: "묻다", latin: "mut-da", id: "Bertanya" },
          { kr: "그렇다", latin: "geu-reot-da", id: "Begitu" },
          { kr: "낫다", latin: "nat-da", id: "Sembuh" },
          { kr: "이렇다", latin: "i-reot-da", id: "Seperti ini" },
          { kr: "짓다", latin: "jit-da", id: "Membangun" },
          { kr: "어떻다", latin: "eo-tteot-da", id: "Bagaimana" },
          { kr: "모르다", latin: "mo-reu-da", id: "Tidak tahu" },
          { kr: "파랗다", latin: "pa-rat-da", id: "Biru" },
          { kr: "부르다", latin: "bu-reu-da", id: "Memanggil, bernyanyi" },
          { kr: "하얗다", latin: "ha-yat-da", id: "Putih" },
          { kr: "다르다", latin: "da-reu-da", id: "Berbeda" },
        ],
      };

      let currentWeek = Object.keys(vocabData)[0];
      let hideTarget = "ID";
      let hideStates = {};
      let isPanelCollapsed = true;
      let isFullVocabMode = false;
      let isFlashcardMode = false;
      let currentQuizIndex = 0;
      let isQuizAnsVisible = false;

      const STORAGE_KEY = "k_learning_fase4_memorized";
      let memorizedData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

      function speakKorean(text) {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "ko-KR";
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        } else {
          alert("Browser tidak mendukung pengucapan suara.");
        }
      }

      window.onload = function () {
        const weekContainer = document.getElementById("week-filter-container");
        Object.keys(vocabData).forEach((week, index) => {
          const btn = document.createElement("button");
          btn.className = `week-btn ${index === 0 ? "active" : ""}`;
          btn.innerText = week;
          btn.onclick = () => selectWeek(week, btn);
          weekContainer.appendChild(btn);
        });
        renderVocab();
      };

      function toggleRightPanel() {
        const rightPanel = document.getElementById("right-panel");
        const btnIcon = document.getElementById("panel-btn-icon");
        const btnText = document.getElementById("panel-btn-text");

        isPanelCollapsed = !isPanelCollapsed;

        if (isPanelCollapsed) {
          rightPanel.classList.add("collapsed");
          btnIcon.innerText = "📖";
          btnText.innerText = "Tampilkan Kosakata";
        } else {
          rightPanel.classList.remove("collapsed");
          btnIcon.innerText = "📖";
          btnText.innerText = "Sembunyikan Kosakata";
        }
      }

      function toggleFullVocabMode() {
        const leftPanel = document.getElementById("left-panel");
        const rightPanel = document.getElementById("right-panel");
        const fullBtn = document.getElementById("full-vocab-btn");

        isFullVocabMode = !isFullVocabMode;

        if (isFullVocabMode) {
          leftPanel.classList.add("hidden-modul");
          rightPanel.classList.add("fullscreen");
          fullBtn.innerText = "📑 Tampilkan Modul";
          fullBtn.style.background = "var(--primary)";
          fullBtn.style.color = "white";
        } else {
          leftPanel.classList.remove("hidden-modul");
          rightPanel.classList.remove("fullscreen");
          fullBtn.innerText = "↔️ Focus Mode";
          fullBtn.style.background = "#ffffff";
          fullBtn.style.color = "var(--primary)";
        }
      }

      function toggleViewMode() {
        isFlashcardMode = !isFlashcardMode;
        const viewBtn = document.getElementById("view-mode-btn");
        const listContainer = document.getElementById("vocab-list");
        const flashcardContainer = document.getElementById(
          "flashcard-container",
        );
        const hideAllBtn = document.getElementById("hide-all-btn");

        if (isFlashcardMode) {
          viewBtn.innerText = "📋 Mode Daftar All";
          listContainer.style.display = "none";
          flashcardContainer.style.display = "flex";
          hideAllBtn.style.display = "none";
          currentQuizIndex = 0;
          isQuizAnsVisible = false;
          renderQuizCard();
        } else {
          viewBtn.innerText = "🎴 Mode Flashcard";
          listContainer.style.display = "flex";
          flashcardContainer.style.display = "none";
          hideAllBtn.style.display = "inline-block";
          renderVocab();
        }
      }

      function selectWeek(week, btnElement) {
        document
          .querySelectorAll(".week-btn")
          .forEach((b) => b.classList.remove("active"));
        btnElement.classList.add("active");
        currentWeek = week;
        hideStates = {};
        currentQuizIndex = 0;
        isQuizAnsVisible = false;

        if (isFlashcardMode) {
          renderQuizCard();
        } else {
          renderVocab();
        }
      }

      function toggleHideTarget() {
        hideTarget = hideTarget === "ID" ? "KR" : "ID";
        document.getElementById("hide-mode-label").innerText =
          hideTarget === "ID" ? "Sembunyi ID" : "Sembunyi KR";

        if (isFlashcardMode) {
          isQuizAnsVisible = false;
          renderQuizCard();
        } else {
          renderVocab();
        }
      }

      function toggleSingleItem(index) {
        hideStates[index] = !hideStates[index];
        renderVocab();
      }

      function toggleHideAll() {
        const currentList = vocabData[currentWeek];
        const allHidden = currentList.every((_, idx) => hideStates[idx]);

        currentList.forEach((_, idx) => {
          hideStates[idx] = !allHidden;
        });

        const hideAllBtn = document.getElementById("hide-all-btn");
        hideAllBtn.innerText = allHidden
          ? "🙈 Sembunyi Semua"
          : "👁️ Tampilkan Semua";

        renderVocab();
      }

      function toggleMemorized(itemKey) {
        memorizedData[itemKey] = !memorizedData[itemKey];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(memorizedData));

        if (isFlashcardMode) {
          renderQuizCard();
        } else {
          renderVocab();
        }
      }

      function updateProgressBar() {
        const currentList = vocabData[currentWeek];
        let memorizedCount = 0;

        currentList.forEach((item) => {
          const itemKey = `${currentWeek}_${item.kr}`;
          if (memorizedData[itemKey]) {
            memorizedCount++;
          }
        });

        const total = currentList.length;
        const percentage =
          total > 0 ? Math.round((memorizedCount / total) * 100) : 0;

        document.getElementById("progress-bar-fill").style.width =
          `${percentage}%`;
        document.getElementById("progress-text").innerText =
          `${memorizedCount}/${total} (${percentage}%)`;
      }

      function renderVocab() {
        const vocabList = document.getElementById("vocab-list");
        vocabList.innerHTML = "";

        vocabData[currentWeek].forEach((item, index) => {
          const isHidden = hideStates[index] || false;
          const isKrHidden = isHidden && hideTarget === "KR";
          const isIdHidden = isHidden && hideTarget === "ID";

          const itemKey = `${currentWeek}_${item.kr}`;
          const isMemorized = memorizedData[itemKey] || false;

          const card = document.createElement("div");
          card.className = `vocab-card ${isMemorized ? "memorized" : ""}`;
          card.innerHTML = `
            <div class="vocab-content">
              <div class="vocab-kr-row">
                <span class="vocab-kr ${isKrHidden ? "blur-text" : ""}">${item.kr}</span>
                <button class="btn-audio-sm" onclick="speakKorean('${item.kr.replace(/ \/ .*/, "")}')" title="Dengarkan pengucapan">🔊</button>
              </div>
              <div class="vocab-latin ${isKrHidden ? "blur-text" : ""}">${item.latin}</div>
              <div class="vocab-id ${isIdHidden ? "blur-text" : ""}">${item.id}</div>
            </div>
            <div class="card-right-actions">
              <button class="memorize-btn ${isMemorized ? "done" : ""}" onclick="toggleMemorized('${itemKey}')" title="Tandai Sudah Hafal">
                ${isMemorized ? "✅ Hafal" : "🟩 Belum"}
              </button>
              <button class="item-toggle-btn" onclick="toggleSingleItem(${index})" title="Sembunyikan/Tampilkan">
                ${isHidden ? "👁️" : "🙈"}
              </button>
            </div>
          `;
          vocabList.appendChild(card);
        });

        updateProgressBar();
      }

      function renderQuizCard() {
        const currentList = vocabData[currentWeek];
        if (!currentList || currentList.length === 0) return;

        const item = currentList[currentQuizIndex];
        const itemKey = `${currentWeek}_${item.kr}`;
        const isMemorized = memorizedData[itemKey] || false;

        document.getElementById("quiz-counter").innerText =
          `KATA ${currentQuizIndex + 1} DARI ${currentList.length}`;

        const quizKr = document.getElementById("quiz-kr");
        const quizLatin = document.getElementById("quiz-latin");
        const quizIdText = document.getElementById("quiz-id-text");
        const toggleAnsBtn = document.getElementById("quiz-toggle-ans-btn");

        quizKr.innerText = item.kr;
        quizLatin.innerText = item.latin;
        quizIdText.innerText = item.id;

        if (hideTarget === "ID") {
          quizKr.classList.remove("blur-text");
          quizLatin.classList.remove("blur-text");

          if (isQuizAnsVisible) {
            quizIdText.classList.remove("blur-text");
            toggleAnsBtn.innerText = "🙈 Sembunyikan Arti";
          } else {
            quizIdText.classList.add("blur-text");
            toggleAnsBtn.innerText = "👁️ Tampilkan Arti";
          }
        } else {
          quizIdText.classList.remove("blur-text");

          if (isQuizAnsVisible) {
            quizKr.classList.remove("blur-text");
            quizLatin.classList.remove("blur-text");
            toggleAnsBtn.innerText = "🙈 Sembunyikan Korea";
          } else {
            quizKr.classList.add("blur-text");
            quizLatin.classList.add("blur-text");
            toggleAnsBtn.innerText = "👁️ Tampilkan Korea";
          }
        }

        const quizCard = document.getElementById("quiz-card");
        const memBtn = document.getElementById("quiz-memorize-btn");

        if (isMemorized) {
          quizCard.classList.add("memorized");
          memBtn.innerText = "✅ Sudah Hafal";
          memBtn.classList.add("done");
        } else {
          quizCard.classList.remove("memorized");
          memBtn.innerText = "🟩 Belum Hafal";
          memBtn.classList.remove("done");
        }

        updateProgressBar();
      }

      function speakCurrentQuiz() {
        const item = vocabData[currentWeek][currentQuizIndex];
        if (item) speakKorean(item.kr.replace(/ \/ .*/, ""));
      }

      function toggleQuizAnswer() {
        isQuizAnsVisible = !isQuizAnsVisible;
        renderQuizCard();
      }

      function toggleQuizMemorized() {
        const item = vocabData[currentWeek][currentQuizIndex];
        if (item) {
          toggleMemorized(`${currentWeek}_${item.kr}`);
        }
      }

      function nextQuizCard() {
        const currentList = vocabData[currentWeek];
        if (currentQuizIndex < currentList.length - 1) {
          currentQuizIndex++;
          isQuizAnsVisible = false;
          renderQuizCard();
        }
      }

      function prevQuizCard() {
        if (currentQuizIndex > 0) {
          currentQuizIndex--;
          isQuizAnsVisible = false;
          renderQuizCard();
        }
      }

      /* Timer Functions */
      let timerInterval = null,
        timeLeft = 25 * 60,
        isTimerRunning = false;

      function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60),
          seconds = timeLeft % 60;
        document.getElementById("timer").innerText =
          `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
      }

      function toggleTimer() {
        const btn = document.getElementById("start-timer-btn");
        if (isTimerRunning) {
          clearInterval(timerInterval);
          isTimerRunning = false;
          btn.innerText = "Start";
          btn.classList.remove("stop");
        } else {
          isTimerRunning = true;
          btn.innerText = "Pause";
          btn.classList.add("stop");
          timerInterval = setInterval(() => {
            if (timeLeft > 0) {
              timeLeft--;
              updateTimerDisplay();
            } else {
              clearInterval(timerInterval);
              alert("Waktu belajar selesai! Istirahat dulu.");
              resetTimer();
            }
          }, 1000);
        }
      }

      function resetTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        timeLeft = 25 * 60;
        document.getElementById("start-timer-btn").innerText = "Start";
        document.getElementById("start-timer-btn").classList.remove("stop");
        updateTimerDisplay();
      }

      updateTimerDisplay();
    </script>
  </body>
</html>
