<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kamus Korea · K-Learning Platform</title>

    <!-- Favicon Logo Hangul -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e11d48'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='white' font-size='60' font-family='sans-serif' font-weight='bold'>한</text></svg>"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #1e293b;
        --teal: #264653;
        --red: #e11d48;
        --green: #10b981;
        --bg: #f8fafc;
        --card: #fff;
        --ink: #0f172a;
        --mute: #64748b;
        --line: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", "Noto Sans KR", system-ui, sans-serif;
        line-height: 1.45;
        font-size: 14px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }

      /* NAVBAR */
      .top {
        position: sticky;
        top: 0;
        z-index: 20;
        height: 52px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.05rem;
        white-space: nowrap;
      }
      .logo {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--red);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.9rem;
        font-family: "Noto Sans KR", sans-serif;
      }

      /* HALAMAN */
      .wrap {
        max-width: 100%;
        margin: 0 auto;
        padding: 0 16px 80px;
      }
      .head {
        padding: 12px 0 8px;
      }
      .searchrow {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .sbox {
        position: relative;
        flex: 1;
        min-width: 180px;
      }
      #q {
        width: 100%;
        padding: 8px 32px 8px 12px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        font-size: 0.95rem;
        background: #fff;
        font-family: "Noto Sans KR", "Inter", sans-serif;
      }
      #q:focus {
        outline: 0;
        border-color: var(--red);
      }
      #clr {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: #f1f5f9;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        color: var(--mute);
        font-size: 0.75rem;
      }
      .tg {
        background: var(--navy);
        color: #fff;
        border: 1px solid var(--navy);
        padding: 6px 10px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.76rem;
        opacity: 0.55;
        white-space: nowrap;
      }
      .tg.on {
        opacity: 1;
        background: var(--red);
        border-color: var(--red);
      }
      .tg.plain {
        background: #fff;
        color: var(--ink);
        border-color: var(--line);
        opacity: 1;
      }
      .tg.plain.on {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .tools {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
      }
      select {
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font-size: 0.78rem;
      }
      .rate {
        font-size: 0.75rem;
        color: var(--mute);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        margin: 10px 0 12px;
      }
      .stat .row {
        display: flex;
        justify-content: space-between;
        font-size: 0.78rem;
        color: var(--mute);
        font-weight: 500;
        margin-bottom: 4px;
      }
      .prog {
        height: 8px;
        background: #eef2f7;
        border-radius: 99px;
        overflow: hidden;
      }
      .prog i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--red), #fb7185);
        transition: width 0.3s;
      }

      /* KARTU KATA */
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        align-items: start;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        transition: box-shadow 0.15s;
      }
      .card:hover {
        box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
      }
      .card.done {
        border-color: #a7f3d0;
        background: #f0fdf9;
      }
      .main {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        align-items: center;
      }
      .ko {
        font:
          500 1.25rem "Noto Sans KR",
          sans-serif;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .badge {
        font:
          600 0.62rem "Inter",
          sans-serif;
        padding: 1px 6px;
        border-radius: 99px;
        background: #eef2f7;
        color: var(--mute);
      }
      .badge.d {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .badge.m {
        background: #fce7f3;
        color: #be185d;
      }
      .rom {
        color: var(--red);
        font-style: italic;
        font-size: 0.8rem;
        font-weight: 500;
        min-height: 1.1em;
      }
      .id {
        color: var(--mute);
        font-size: 0.88rem;
      }
      .id.none {
        color: #cbd5e1;
        font-style: italic;
      }
      .side {
        grid-column: 2;
        grid-row: 1/4;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .btn-s {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        background: #f1f5f9;
        border-radius: 6px;
        padding: 5px 10px;
        font-weight: 600;
        font-size: 0.78rem;
        color: var(--ink);
      }
      .btn-s:before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--green);
      }
      .done .btn-s {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .done .btn-s:before {
        background: #fff;
      }
      .ib {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #f1f5f9;
        font-size: 0.88rem;
      }
      .ib:hover {
        background: #e2e8f0;
      }
      .ib.on {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .ib small {
        font-size: 0.65rem;
        font-weight: 700;
      }
      .exs {
        margin-top: 8px;
        border-top: 1px dashed var(--line);
        padding-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ex1 {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0 8px;
        align-items: center;
      }
      .exk {
        font:
          500 0.95rem "Noto Sans KR",
          sans-serif;
      }
      .exk mark {
        background: #fee2e8;
        color: inherit;
        border-radius: 3px;
        padding: 0 2px;
      }
      .exr {
        color: var(--red);
        font-style: italic;
        font-size: 0.75rem;
      }
      .exi {
        color: var(--mute);
        font-size: 0.8rem;
      }
      .say {
        grid-row: 1/4;
        grid-column: 2;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #f1f5f9;
      }
      .exsec {
        font-size: 0.65rem;
        color: var(--mute);
      }
      .more {
        display: block;
        margin: 14px auto 0;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        padding: 8px 18px;
        font-weight: 600;
        font-size: 0.82rem;
      }
      .more:hover {
        background: var(--navy);
        color: #fff;
      }
      .empty {
        text-align: center;
        color: var(--mute);
        padding: 40px 16px;
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 10px;
        font-size: 0.88rem;
      }

      /* BLUR */
      .hide-ko .card .ko:not(.rev),
      .hide-rom .card .rom:not(.rev),
      .hide-id .card .id:not(.rev) {
        filter: blur(6px);
        cursor: pointer;
        user-select: none;
      }

      /* KEYBOARD POPUP (bisa digeser) */
      #kb {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 60;
        width: min(480px, 92vw);
        background: #e2e8f0;
        border: 1px solid #94a3b8;
        border-radius: 14px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
        display: none;
        overflow: hidden;
      }
      body.kbopen #kb {
        display: block;
      }
      #kbh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--navy);
        color: #fff;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #kbh.drag {
        cursor: grabbing;
      }
      #kbh .grip {
        letter-spacing: 2px;
        opacity: 0.6;
        font-size: 0.9rem;
      }
      #kbh .tt {
        font-weight: 600;
        font-size: 0.8rem;
      }
      #kbh .prev {
        flex: 1;
        min-width: 0;
        text-align: center;
        font:
          500 0.9rem "Noto Sans KR",
          sans-serif;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.9;
      }
      #kbx {
        border: 0;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        font-size: 0.85rem;
      }
      #kbx:hover {
        background: var(--red);
      }
      .kbin {
        padding: 8px 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        user-select: none;
        -webkit-user-select: none;
      }
      .kr {
        display: flex;
        gap: 4px;
        justify-content: center;
      }
      .kk {
        flex: 1;
        max-width: 46px;
        height: 40px;
        border: 0;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 2px 0 #94a3b8;
        font:
          500 1.1rem "Noto Sans KR",
          sans-serif;
        color: var(--ink);
        touch-action: manipulation;
      }
      .kk:active {
        transform: translateY(2px);
        box-shadow: none;
        background: #fee2e8;
      }
      .kk.fn {
        flex: none;
        max-width: none;
        padding: 0 12px;
        font:
          600 0.8rem "Inter",
          sans-serif;
        background: #cbd5e1;
      }
      .kk.sp {
        flex: 1;
        max-width: none;
        background: #fff;
        font:
          500 0.8rem "Inter",
          sans-serif;
      }
      .kk.fn.on {
        background: var(--red);
        color: #fff;
      }

      @media (max-width: 560px) {
        .kk {
          height: 36px;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">한</span><span>Kamus Korea</span>
      </div>
    </header>

    <div class="wrap">
      <div class="head">
        <div class="searchrow">
          <div class="sbox">
            <input
              id="q"
              type="text"
              placeholder="Cari kata Korea / arti Indonesia / romanisasi…"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
            <button id="clr" title="Hapus">✕</button>
          </div>
          <button class="tg plain" id="kbt" title="Keyboard Hangul melayang">
            ⌨ Keyboard
          </button>
          <button
            class="tg plain"
            id="hm"
            title="Ketik huruf latin di keyboard fisik, hasilnya Hangul"
          >
            한 Ketik
          </button>
        </div>
        <div class="tools">
          <button class="tg" data-h="ko">Sembunyi Hangul</button>
          <button class="tg" data-h="rom">Sembunyi Romanisasi</button>
          <button class="tg" data-h="id">Sembunyi Arti</button>
          <button class="tg plain" id="todo">Belum hafal</button>
          <button class="tg plain" id="mean">Ada arti saja</button>
          <select id="sort">
            <option value="abc">Urut abjad</option>
            <option value="urut">Urut kemunculan</option>
          </select>
          <label class="rate"
            >Speed
            <input
              type="range"
              id="rate"
              min=".5"
              max="1.2"
              step=".1"
              value=".8"
          /></label>
        </div>
      </div>
      <div class="stat">
        <div class="row">
          <span>Status Hafal (kata)</span><span id="pt"></span>
        </div>
        <div class="prog"><i id="bar"></i></div>
      </div>
      <p
        id="sub"
        style="font-size: 0.78rem; color: var(--mute); margin-bottom: 6px"
      ></p>
      <div id="list"></div>
    </div>

    <div id="kb">
      <div id="kbh">
        <span class="grip">⠿</span><span class="tt">Keyboard</span
        ><span class="prev" id="kbp"></span
        ><button id="kbx" title="Tutup">✕</button>
      </div>
      <div class="kbin" id="kbin"></div>
    </div>

    <script>
      // ===== INSIALISASI STRUKTUR DATA (DIPISAH PER LEVEL) =====
      const DATA = {
        dasar: { label: "Dasar (해요체)", sections: [] },
        menengah: { label: "Menengah-Atas", sections: [] },
      };
      const W = {};
      const add = (lv, t, items) => DATA[lv].sections.push({ t, items });
      const addW = (s) =>
        s
          .trim()
          .split("\n")
          .forEach((l) => {
            const i = l.indexOf("=");
            if (i > 0) W[l.slice(0, i).trim()] = l.slice(i + 1).trim();
          });

      // =========================================================================
      // TEMPELKAN SEMUA PEMANGGILAN add(...) DAN addW(...) KAMU DI SINI
      // =========================================================================
      // ---------- BAGIAN 1: DASAR · Salam, perkenalan, ungkapan sopan ----------
      add("dasar", "1a. Salam harian", [
        ["안녕하세요.", "annyeonghaseyo", "Halo / selamat pagi-siang-sore."],
        [
          "안녕하세요? 잘 지내세요?",
          "annyeonghaseyo? jal jinaeseyo?",
          "Halo, apa kabar?",
        ],
        ["네, 잘 지내요.", "ne, jal jinaeyo", "Ya, saya baik-baik saja."],
        ["오랜만이에요.", "oraenmanieyo", "Lama tidak bertemu."],
        ["만나서 반가워요.", "mannaseo bangawoyo", "Senang bertemu denganmu."],
        ["좋은 아침이에요.", "joeun achimieyo", "Selamat pagi."],
        [
          "안녕히 가세요.",
          "annyeonghi gaseyo",
          "Selamat jalan (kamu yang pergi).",
        ],
        [
          "안녕히 계세요.",
          "annyeonghi gyeseyo",
          "Selamat tinggal (aku yang pergi, kamu tetap).",
        ],
        ["잘 자요.", "jal jayo", "Selamat tidur."],
        ["내일 봐요.", "naeil bwayo", "Sampai jumpa besok."],
      ]);

      add("dasar", "1b. Perkenalan diri", [
        [
          "저는 [nama]이에요 / 예요.",
          "jeoneun [nama]ieyo / yeyo",
          "Saya [nama].",
        ],
        [
          "제 이름은 [nama]이에요.",
          "je ireumeun [nama]ieyo",
          "Nama saya [nama].",
        ],
        ["이름이 뭐예요?", "ireumi mwoyeyo", "Siapa namamu?"],
        [
          "저는 인도네시아 사람이에요.",
          "jeoneun indonesia saramieyo",
          "Saya orang Indonesia.",
        ],
        [
          "저는 반둥에서 왔어요.",
          "jeoneun bandungeseo wasseoyo",
          "Saya berasal dari Bandung.",
        ],
        ["어디에서 왔어요?", "eodieseo wasseoyo", "Kamu berasal dari mana?"],
        [
          "저는 학생이에요.",
          "jeoneun hakssaengieyo",
          "Saya pelajar / mahasiswa.",
        ],
        ["직업이 뭐예요?", "jigeobi mwoyeyo", "Pekerjaanmu apa?"],
        [
          "한국어를 공부하고 있어요.",
          "hangugeoreul gongbuhago isseoyo",
          "Saya sedang belajar bahasa Korea.",
        ],
        [
          "아직 한국어를 잘 못해요.",
          "ajik hangugeoreul jal mothaeyo",
          "Saya belum bisa bahasa Korea dengan baik.",
        ],
        [
          "천천히 말해 주세요.",
          "cheoncheonhi malhae juseyo",
          "Tolong bicara pelan-pelan.",
        ],
        [
          "다시 한번 말해 주세요.",
          "dasi hanbeon malhae juseyo",
          "Tolong katakan sekali lagi.",
        ],
        ["무슨 뜻이에요?", "museun tteusieyo", "Apa artinya?"],
        [
          "이해했어요. / 이해 못 했어요.",
          "ihaehaesseoyo / ihae mot haesseoyo",
          "Saya mengerti. / Saya tidak mengerti.",
        ],
        [
          "영어 할 수 있어요?",
          "yeongeo hal su isseoyo",
          "Bisa bahasa Inggris?",
        ],
      ]);

      add("dasar", "2. Ungkapan sopan sehari-hari", [
        ["감사합니다.", "gamsahamnida", "Terima kasih (formal)."],
        ["고마워요.", "gomawoyo", "Terima kasih (santai-sopan)."],
        ["정말 고마워요.", "jeongmal gomawoyo", "Terima kasih banyak."],
        ["천만에요.", "cheonmaneyo", "Sama-sama."],
        ["괜찮아요.", "gwaenchanayo", "Tidak apa-apa / baik-baik saja."],
        ["죄송합니다.", "joesonghamnida", "Mohon maaf (formal)."],
        ["미안해요.", "mianhaeyo", "Maaf."],
        ["실례합니다.", "sillyehamnida", "Permisi (mau lewat atau bertanya)."],
        ["잠깐만요.", "jamkkanmanyo", "Sebentar ya."],
        ["잠시만요.", "jamsimanyo", "Permisi sebentar (saat minta jalan)."],
        ["네. / 아니요.", "ne / aniyo", "Ya. / Tidak."],
        ["맞아요.", "majayo", "Benar."],
        ["잘 모르겠어요.", "jal moreugesseoyo", "Saya kurang tahu."],
        [
          "잘 먹겠습니다.",
          "jal meokgetseumnida",
          "Selamat makan (diucapkan sebelum makan).",
        ],
        [
          "잘 먹었습니다.",
          "jal meogeotseumnida",
          "Terima kasih atas makanannya (setelah makan).",
        ],
        [
          "수고하셨어요.",
          "sugohasyeosseoyo",
          "Terima kasih atas kerja kerasnya.",
        ],
        ["축하해요!", "chukahaeyo", "Selamat!"],
        ["조심하세요.", "josimhaseyo", "Hati-hati."],
        ["도와주세요.", "dowajuseyo", "Tolong bantu saya."],
        ["화이팅!", "hwaiting", "Semangat!"],
      ]);

      // ---------- KAMUS KATA (bagian 1) ----------
      addW(`안녕하세요=halo / selamat (sopan)
      
잘=dengan baik
지내세요=apakah Anda baik-baik (hormat)
네=ya
지내요=baik-baik saja
오랜만이에요=lama tidak bertemu
만나서=bertemu (lalu...)
반가워요=senang
좋은=bagus
아침이에요=(adalah) pagi
안녕히=dengan selamat
가세요=pergilah
계세요=tinggallah / tetap di sana
자요=tidur
내일=besok
봐요=lihat / bertemu
저는=saya (topik)
[nama]이에요=(adalah) [nama]
/=atau
예요=adalah
제=saya (milik)
이름은=nama (topik)
이름이=nama (subjek)
뭐예요=apa
인도네시아=Indonesia
사람이에요=(adalah) orang
반둥에서=dari Bandung
왔어요=sudah datang

        ["종이가 얇아서 잘 찢어져요.", "jongiga yalbaseo jal jjijeojyeoyo", "Kertasnya tipis jadi mudah robek."],
        ["방이 넓어서 마음에 들어요.", "bangi neolbeoseo maeume deureoyo", "Kamarnya luas jadi saya suka."],
        ["길이 좁아서 차가 못 지나가요.", "giri jobaseo chaga mot jinagayo", "Jalannya sempit jadi mobil tidak bisa lewat."],
        ["가방이 너무 무거워요.", "gabangi neomu mugeowoyo", "Tasnya terlalu berat."],
        ["이 노트북은 가벼워서 들고 다니기 편해요.", "i noteubugeun gabyeowoseo deulgo danigi pyeonhaeyo", "Laptop ini ringan jadi nyaman dibawa ke mana-mana."],
        ["달이 동그랗게 떴어요.", "dari donggeurakge tteosseoyo", "Bulan terbit dengan bentuk bulat sempurna."],
        ["네모난 상자에 물건을 담았어요.", "nemonan sangjae mulgeoneul damasseoyo", "Saya memasukkan barang ke dalam kotak persegi."]
      ]);

      addW(`길다=panjang
짧다=pendek
높다=tinggi
낮다=rendah
두껍다=tebal
얇다=tipis
넓다=luas / lebar
좁다=sempit
무겁다=berat
가볍다=ringan
동그랗다=bulat / bundar
네모나다=persegi / kotak`);

      // ===== HANGUL ENGINE =====
      const CHO = [..."ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"];
      const JUNG = [..."ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ"];
      const JONG = [
        "",
        ..."ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ",
      ];
      const VCOMB = {
        ㅗㅏ: "ㅘ",
        ㅗㅐ: "ㅙ",
        ㅗㅣ: "ㅚ",
        ㅜㅓ: "ㅝ",
        ㅜㅔ: "ㅞ",
        ㅜㅣ: "ㅟ",
        ㅡㅣ: "ㅢ",
      };
      const JCOMB = {
        ㄱㅅ: "ㄳ",
        ㄴㅈ: "ㄵ",
        ㄴㅎ: "ㄶ",
        ㄹㄱ: "ㄺ",
        ㄹㅁ: "ㄻ",
        ㄹㅂ: "ㄼ",
        ㄹㅅ: "ㄽ",
        ㄹㅌ: "ㄾ",
        ㄹㅍ: "ㄿ",
        ㄹㅎ: "ㅀ",
        ㅂㅅ: "ㅄ",
      };
      const inv = (o) =>
        Object.fromEntries(Object.entries(o).map(([k, v]) => [v, [...k]]));
      const VSPLIT = inv(VCOMB),
        JSPLIT = inv(JCOMB);
      const dec = (ch) => {
        const c = ch.charCodeAt(0) - 0xac00;
        return c < 0 || c > 11171
          ? null
          : {
              c: Math.floor(c / 588),
              v: Math.floor((c % 588) / 28),
              t: c % 28,
            };
      };
      const mk = (c, v, t) =>
        String.fromCharCode(0xac00 + c * 588 + v * 28 + t);
      const isV = (j) => JUNG.includes(j);

      function typeJamo(s, j) {
        const last = s.slice(-1),
          head = s.slice(0, -1),
          d = last ? dec(last) : null;
        if (isV(j)) {
          if (d) {
            if (d.t) {
              const tj = JONG[d.t],
                sp = JSPLIT[tj];
              if (sp)
                return (
                  head +
                  mk(d.c, d.v, JONG.indexOf(sp[0])) +
                  mk(CHO.indexOf(sp[1]), JUNG.indexOf(j), 0)
                );
              return (
                head + mk(d.c, d.v, 0) + mk(CHO.indexOf(tj), JUNG.indexOf(j), 0)
              );
            }
            const cb = VCOMB[JUNG[d.v] + j];
            return cb ? head + mk(d.c, JUNG.indexOf(cb), 0) : s + j;
          }
          if (last && CHO.includes(last))
            return head + mk(CHO.indexOf(last), JUNG.indexOf(j), 0);
          return s + j;
        }
        if (d) {
          if (!d.t) {
            const ti = JONG.indexOf(j);
            return ti > 0 ? head + mk(d.c, d.v, ti) : s + j;
          }
          const cb = JCOMB[JONG[d.t] + j];
          if (cb) return head + mk(d.c, d.v, JONG.indexOf(cb));
        }
        return s + j;
      }
      function backspace(s) {
        if (!s) return s;
        const last = s.slice(-1),
          head = s.slice(0, -1),
          d = dec(last);
        if (!d) return head;
        if (d.t) {
          const sp = JSPLIT[JONG[d.t]];
          return head + mk(d.c, d.v, sp ? JONG.indexOf(sp[0]) : 0);
        }
        const vs = VSPLIT[JUNG[d.v]];
        if (vs) return head + mk(d.c, JUNG.indexOf(vs[0]), 0);
        return head + CHO[d.c];
      }
      const toJamo = (s) =>
        [...String(s)]
          .map((ch) => {
            const d = dec(ch);
            return d ? CHO[d.c] + JUNG[d.v] + JONG[d.t] : ch.toLowerCase();
          })
          .join("");

      // susunan 두벌식
      const QMAP = {
        q: "ㅂ",
        w: "ㅈ",
        e: "ㄷ",
        r: "ㄱ",
        t: "ㅅ",
        y: "ㅛ",
        u: "ㅕ",
        i: "ㅑ",
        o: "ㅐ",
        p: "ㅔ",
        a: "ㅁ",
        s: "ㄴ",
        d: "ㅇ",
        f: "ㄹ",
        g: "ㅎ",
        h: "ㅗ",
        j: "ㅓ",
        k: "ㅏ",
        l: "ㅣ",
        z: "ㅋ",
        x: "ㅌ",
        c: "ㅊ",
        v: "ㅍ",
        b: "ㅠ",
        n: "ㅜ",
        m: "ㅡ",
      };
      const QUP = {
        q: "ㅃ",
        w: "ㅉ",
        e: "ㄸ",
        r: "ㄲ",
        t: "ㅆ",
        o: "ㅒ",
        p: "ㅖ",
      };
      const jamoOf = (k, sh) => (sh && QUP[k] ? QUP[k] : QMAP[k]);

      // ===== INDEX KAMUS (dibangun dari DATA + W) =====
      const HAN = /[\uAC00-\uD7A3\u3131-\u318E]/;
      const clean = (t) => String(t).replace(/[.?!,;:"'“”‘’()]/g, "");
      let IDX = [],
        EM = new Map();
      function build() {
        EM = new Map();
        const get = (k) => {
          let e = EM.get(k);
          if (!e) {
            e = {
              ko: k,
              id: W[k] || "",
              rom: "",
              ex: [],
              lv: new Set(),
              n: EM.size,
            };
            EM.set(k, e);
          }
          return e;
        };
        Object.keys(W).forEach((k) => {
          if (HAN.test(k)) get(k);
        });
        Object.entries(DATA).forEach(([lv, L]) =>
          L.sections.forEach((s) =>
            s.items.forEach((it) => {
              const kt = String(it[0]).split(/\s+/),
                rt = String(it[1]).split(/\s+/),
                al = kt.length === rt.length,
                seen = new Set();
              kt.forEach((t, i) => {
                const k = clean(t);
                if (!HAN.test(k)) return;
                const e = get(k);
                if (!e.rom && al) e.rom = clean(rt[i]).toLowerCase();
                e.lv.add(lv);
                if (!seen.has(k)) {
                  seen.add(k);
                  e.ex.push({ ko: it[0], rom: it[1], id: it[2], sec: s.t, lv });
                }
              });
            }),
          ),
        );
        IDX = [...EM.values()];
      }

      // ===== STATE =====
      const $ = (s) => document.querySelector(s),
        list = $("#list"),
        inp = $("#q");
      const store = {
        get(k, d) {
          try {
            return JSON.parse(localStorage.getItem(k)) ?? d;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      let q = "",
        onlyTodo = false,
        onlyMean = false,
        limit = 40,
        kbOpen = false,
        hmode = false,
        shift = false;
      const done = new Set(store.get("kk-done", [])),
        hide = new Set(store.get("kk-hide", [])),
        open = new Set();

      // ===== AUDIO =====
      function speak(t) {
        if (!("speechSynthesis" in window))
          return alert("Browser kamu belum mendukung audio. Coba Chrome/Edge.");
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(
          String(t).replace(/\[.*?\]/g, ""),
        );
        u.lang = "ko-KR";
        u.rate = +$("#rate").value;
        const v = speechSynthesis
          .getVoices()
          .find((v) => v.lang.replace("_", "-").startsWith("ko"));
        if (v) u.voice = v;
        speechSynthesis.speak(u);
      }
      speechSynthesis.onvoiceschanged = () => {};

      // ===== PENCARIAN DUA ARAH (KOREA <-> INDONESIA <-> ROMANISASI) =====
      function match(e, s) {
        if (!s) return true;
        const l = s.toLowerCase().trim();

        // 1. Jika input mengandung karakter Hangul (Pencarian Korea)
        if (HAN.test(s)) {
          return toJamo(e.ko).includes(toJamo(s));
        }

        // 2. Jika input huruf Latin (Pencarian Arti Bahasa Indonesia, Romanisasi, atau Kata Korea)
        const matchArti = e.id && e.id.toLowerCase().includes(l);
        const matchRomanisasi = e.rom && e.rom.toLowerCase().includes(l);
        const matchKataKorea = e.ko && e.ko.toLowerCase().includes(l);

        return matchArti || matchRomanisasi || matchKataKorea;
      }
      const hl = (ko, k) =>
        esc(ko)
          .split(esc(k))
          .join("<mark>" + esc(k) + "</mark>");

      // ===== RENDER =====
      function render() {
        let L = IDX.filter(
          (e) =>
            (!onlyTodo || !done.has(e.ko)) &&
            (!onlyMean || e.id) &&
            match(e, q),
        );
        L =
          $("#sort").value === "abc"
            ? L.sort((a, b) => a.ko.localeCompare(b.ko, "ko"))
            : L.sort((a, b) => a.n - b.n);
        const shown = L.slice(0, limit);

        list.innerHTML = shown.length
          ? `<div class="grid">${shown.map(card).join("")}</div>` +
            (L.length > limit
              ? `<button class="more">Tampilkan lebih banyak (${L.length - limit} lagi)</button>`
              : "")
          : `<p class="empty">${IDX.length ? "Tidak ada kata yang cocok." : "Data kosakata masih kosong."}</p>`;

        $("#sub").textContent =
          `${L.length} kata ditampilkan dari ${IDX.length}.`;
        const okN = IDX.filter((e) => done.has(e.ko)).length;
        $("#bar").style.width =
          (IDX.length ? (okN / IDX.length) * 100 : 0) + "%";
        $("#pt").textContent =
          `${okN}/${IDX.length} (${IDX.length ? Math.round((okN / IDX.length) * 100) : 0}%)`;

        document
          .querySelectorAll("[data-h]")
          .forEach((b) => b.classList.toggle("on", hide.has(b.dataset.h)));
        ["ko", "rom", "id"].forEach((h) =>
          document.body.classList.toggle("hide-" + h, hide.has(h)),
        );
      }
      function card(e) {
        const d = done.has(e.ko),
          o = open.has(e.ko);
        const bd = [...e.lv]
          .map(
            (l) =>
              `<span class="badge ${l === "dasar" ? "d" : "m"}">${esc(DATA[l].label)}</span>`,
          )
          .join("");
        const exs = o
          ? `<div class="exs">${
              e.ex
                .slice(0, 5)
                .map(
                  (x) =>
                    `<div class="ex1"><div class="exk">${hl(x.ko, e.ko)}</div><div class="exr">${esc(x.rom)}</div><div class="exi">${esc(x.id)} <span class="exsec">· ${esc(x.sec)}</span></div><button class="say" data-t="${esc(x.ko)}" title="Putar kalimat">🔊</button></div>`,
                )
                .join("") || '<div class="exi">Belum ada contoh kalimat.</div>'
            }</div>`
          : "";
        return `<article class="card ${d ? "done" : ""}" data-k="${esc(e.ko)}">
  <div class="main">
   <div class="ko" data-p="ko">${esc(e.ko)} ${bd}</div>
   <div class="rom" data-p="rom">${esc(e.rom)}</div>
   <div class="id ${e.id ? "" : "none"}" data-p="id">${e.id ? esc(e.id) : "Arti belum ada"}</div>
   <div class="side"><button class="btn-s ck">${d ? "Hafal" : "Belum"}</button><button class="ib play" title="Putar kata">🔊</button><button class="ib ex ${o ? "on" : ""}" title="Contoh kalimat"><small>${e.ex.length}</small></button></div>
  </div>${exs}</article>`;
      }

      // ===== KEYBOARD POPUP =====
      const kb = $("#kb"),
        kbh = $("#kbh");
      function buildKb() {
        const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
        $("#kbin").innerHTML =
          rows
            .map(
              (r, i) =>
                `<div class="kr">` +
                (i === 2
                  ? `<button class="kk fn ${shift ? "on" : ""}" data-f="shift">⇧</button>`
                  : "") +
                [...r]
                  .map(
                    (k) =>
                      `<button class="kk" data-j="${jamoOf(k, shift)}">${jamoOf(k, shift)}</button>`,
                  )
                  .join("") +
                (i === 2
                  ? `<button class="kk fn" data-f="bs">⌫</button>`
                  : "") +
                `</div>`,
            )
            .join("") +
          `<div class="kr"><button class="kk fn" data-f="clr">Hapus</button><button class="kk sp" data-f="sp">Spasi</button></div>`;
      }
      function setVal(v) {
        inp.value = v;
        q = v.trim();
        limit = 40;
        $("#kbp").textContent = v;
        render();
      }
      $("#kbin").addEventListener("mousedown", (e) => e.preventDefault());
      $("#kbin").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.j) {
          setVal(typeJamo(inp.value, b.dataset.j));
          if (shift) {
            shift = false;
            buildKb();
          }
          return;
        }
        const f = b.dataset.f;
        if (f === "shift") {
          shift = !shift;
          buildKb();
        } else if (f === "bs") setVal(backspace(inp.value));
        else if (f === "clr") setVal("");
        else if (f === "sp") setVal(inp.value + " ");
      });
      function clampPos(x, y) {
        const w = kb.offsetWidth,
          h = kb.offsetHeight;
        return {
          x: Math.min(Math.max(0, x), Math.max(0, innerWidth - w)),
          y: Math.min(Math.max(0, y), Math.max(0, innerHeight - h)),
        };
      }
      function placeKb(x, y) {
        const p = clampPos(x, y);
        kb.style.left = p.x + "px";
        kb.style.top = p.y + "px";
        return p;
      }
      function toggleKb(on) {
        kbOpen = on;
        document.body.classList.toggle("kbopen", on);
        $("#kbt").classList.toggle("on", on);
        inp.setAttribute("inputmode", on ? "none" : "text");
        if (on) {
          buildKb();
          $("#kbp").textContent = inp.value;
          const s = store.get("kk-kbpos", null);
          if (s) placeKb(s.x, s.y);
          else
            placeKb(
              (innerWidth - kb.offsetWidth) / 2,
              innerHeight - kb.offsetHeight - 24,
            );
        }
      }

      let dr = null;
      kbh.addEventListener("pointerdown", (e) => {
        if (e.target.closest("#kbx")) return;
        dr = { dx: e.clientX - kb.offsetLeft, dy: e.clientY - kb.offsetTop };
        kbh.setPointerCapture(e.pointerId);
        kbh.classList.add("drag");
      });
      kbh.addEventListener("pointermove", (e) => {
        if (dr) placeKb(e.clientX - dr.dx, e.clientY - dr.dy);
      });
      const endDrag = () => {
        if (!dr) return;
        dr = null;
        kbh.classList.remove("drag");
        store.set("kk-kbpos", { x: kb.offsetLeft, y: kb.offsetTop });
      };
      kbh.addEventListener("pointerup", endDrag);
      kbh.addEventListener("pointercancel", endDrag);
      $("#kbx").onclick = () => toggleKb(false);
      addEventListener("resize", () => {
        if (kbOpen) placeKb(kb.offsetLeft, kb.offsetTop);
      });

      // ===== EVENTS =====
      list.addEventListener("click", (ev) => {
        if (ev.target.closest(".more")) {
          limit += 40;
          return render();
        }
        const sb = ev.target.closest(".say");
        if (sb) return speak(sb.dataset.t);
        const card = ev.target.closest(".card");
        if (!card) return;
        const k = card.dataset.k,
          part = ev.target.closest("[data-p]");
        if (
          part &&
          document.body.classList.contains("hide-" + part.dataset.p) &&
          !part.classList.contains("rev")
        ) {
          part.classList.add("rev");
          return;
        }
        if (ev.target.closest(".ck")) {
          done.has(k) ? done.delete(k) : done.add(k);
          store.set("kk-done", [...done]);
          return render();
        }
        if (ev.target.closest(".play")) return speak(k);
        if (ev.target.closest(".ex")) {
          open.has(k) ? open.delete(k) : open.add(k);
          return render();
        }
        if (ev.target.closest(".ko")) speak(k);
      });
      inp.addEventListener("input", () => {
        q = inp.value.trim();
        limit = 40;
        $("#kbp").textContent = inp.value;
        render();
      });
      inp.addEventListener("keydown", (e) => {
        if (!hmode || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === "Backspace") {
          e.preventDefault();
          return setVal(backspace(inp.value));
        }
        if (/^[a-zA-Z]$/.test(e.key)) {
          e.preventDefault();
          setVal(typeJamo(inp.value, jamoOf(e.key.toLowerCase(), e.shiftKey)));
        }
      });
      $("#clr").onclick = () => {
        setVal("");
        inp.focus();
      };
      $("#kbt").onclick = () => toggleKb(!kbOpen);
      $("#hm").onclick = (e) => {
        hmode = !hmode;
        e.currentTarget.classList.toggle("on", hmode);
        e.currentTarget.textContent = hmode ? "한 Mode: AKTIF" : "한 Ketik";
        inp.focus();
      };
      $("#todo").onclick = (e) => {
        onlyTodo = !onlyTodo;
        e.currentTarget.classList.toggle("on", onlyTodo);
        limit = 40;
        render();
      };
      $("#mean").onclick = (e) => {
        onlyMean = !onlyMean;
        e.currentTarget.classList.toggle("on", onlyMean);
        limit = 40;
        render();
      };
      $("#sort").onchange = () => {
        limit = 40;
        render();
      };
      document.querySelectorAll("[data-h]").forEach(
        (b) =>
          (b.onclick = () => {
            const h = b.dataset.h;
            hide.has(h) ? hide.delete(h) : hide.add(h);
            store.set("kk-hide", [...hide]);
            render();
          }),
      );

      build();
      render();
    </script>
  </body>
</html>
