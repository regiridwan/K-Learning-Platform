<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kosakata Korea · K-Learning Platform</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #1e293b;
        --teal: #264653;
        --red: #e11d48;
        --green: #10b981;
        --bg: #f8fafc;
        --card: #fff;
        --ink: #0f172a;
        --mute: #64748b;
        --line: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", "Noto Sans KR", system-ui, sans-serif;
        line-height: 1.5;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }

      /* ===== NAVBAR ===== */
      .top {
        position: sticky;
        top: 0;
        z-index: 20;
        height: 65px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.15rem;
        white-space: nowrap;
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--red);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-family: "Noto Sans KR", sans-serif;
      }
      .levels {
        display: flex;
        gap: 8px;
        margin-left: 24px;
      }
      .lv {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 8px 18px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.92rem;
        white-space: nowrap;
      }
      .lv:hover {
        border-color: var(--navy);
      }
      .lv.on {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }

      /* ===== LAYOUT + SIDEBAR ===== */
      .layout {
        display: flex;
        align-items: flex-start;
        max-width: 1500px;
        margin: 0 auto;
      }
      .side-nav {
        position: sticky;
        top: 65px;
        flex: none;
        width: 290px;
        height: calc(100vh - 65px);
        overflow-y: auto;
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 16px 14px 24px;
      }
      #back {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        padding: 9px 14px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--ink);
        text-align: left;
      }
      #back:hover {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .nav-t {
        margin: 18px 4px 8px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .secs {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sec {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink);
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 0.88rem;
        line-height: 1.35;
      }
      .sec small {
        flex: none;
        color: var(--mute);
        font-size: 0.76rem;
        background: #f1f5f9;
        padding: 2px 8px;
        border-radius: 99px;
      }
      .sec:hover {
        background: #fff1f3;
      }
      .sec.on {
        background: var(--red);
        color: #fff;
        font-weight: 600;
      }
      .sec.on small {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .sec.full small {
        background: #d1fae5;
        color: #047857;
        font-weight: 700;
      }
      .sec.on.full small {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }

      /* ===== HEADER HALAMAN ===== */
      .wrap {
        flex: 1;
        min-width: 0;
        padding: 0 28px 120px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 20px 0 12px;
      }
      .head h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      .head p {
        margin: 2px 0 0;
        color: var(--mute);
        font-size: 0.88rem;
      }
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tg {
        background: var(--navy);
        color: #fff;
        border: 1px solid var(--navy);
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.84rem;
        opacity: 0.55;
      }
      .tg.on {
        opacity: 1;
        background: var(--red);
        border-color: var(--red);
      }
      .tg.plain {
        background: #fff;
        color: var(--ink);
        border-color: var(--line);
        opacity: 1;
      }
      .tg.plain.on {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      input[type="search"] {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 200px;
        background: #fff;
      }
      .rate {
        font-size: 0.82rem;
        color: var(--mute);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
      }
      .stat .row {
        display: flex;
        justify-content: space-between;
        font-size: 0.86rem;
        color: var(--mute);
        font-weight: 500;
        margin-bottom: 8px;
      }
      .prog {
        height: 10px;
        background: #eef2f7;
        border-radius: 99px;
        overflow: hidden;
      }
      .prog i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--red), #fb7185);
        transition: width 0.3s;
      }

      /* ===== KARTU ===== */
      h2 {
        font-size: 1rem;
        margin: 26px 0 10px;
        color: var(--teal);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h2:before {
        content: "";
        width: 5px;
        height: 20px;
        border-radius: 3px;
        background: var(--red);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        align-items: center;
        transition: box-shadow 0.15s;
      }
      .card:hover {
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.07);
      }
      .card.done {
        border-color: #a7f3d0;
        background: #f0fdf9;
      }
      .ko {
        font:
          500 1.3rem "Noto Sans KR",
          sans-serif;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
      }
      .w {
        background: none;
        border: 0;
        border-bottom: 2px dotted #cbd5e1;
        font: inherit;
        color: inherit;
        padding: 0 2px;
      }
      .w:hover {
        background: #fee2e8;
        border-color: var(--red);
      }
      .rom {
        color: var(--red);
        font-style: italic;
        font-size: 0.86rem;
        font-weight: 500;
      }
      .id {
        color: var(--mute);
        font-size: 0.95rem;
      }
      .side {
        grid-column: 2;
        grid-row: 1/4;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn-s {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: #f1f5f9;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 600;
        font-size: 0.86rem;
        color: var(--ink);
      }
      .btn-s:before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: var(--green);
      }
      .done .btn-s {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .done .btn-s:before {
        background: #fff;
      }
      .ib {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #f1f5f9;
        font-size: 1rem;
      }
      .ib:hover {
        background: #e2e8f0;
      }

      /* ===== TUTUP / BLUR ===== */
      .hide-ko .ko:not(.rev),
      .hide-rom .rom:not(.rev),
      .hide-id .id:not(.rev),
      .card.hid-id .id {
        filter: blur(8px);
        cursor: pointer;
        user-select: none;
      }

      /* ===== POPUP KATA ===== */
      #pop {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translate(-50%, 160%);
        transition: 0.25s;
        width: min(460px, 92vw);
        background: var(--navy);
        color: #fff;
        border-radius: 14px;
        padding: 14px 18px;
        display: flex;
        gap: 12px;
        align-items: center;
        z-index: 50;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      #pop.show {
        transform: translate(-50%, 0);
      }
      #pop b {
        font:
          700 1.5rem "Noto Sans KR",
          sans-serif;
        display: block;
      }
      #pop span {
        color: #cbd5e1;
        font-size: 0.92rem;
      }
      #pp {
        margin-left: auto;
        background: var(--red);
        color: #fff;
        border: 0;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        font-size: 1.1rem;
      }
      .empty {
        text-align: center;
        color: var(--mute);
        padding: 60px 20px;
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 12px;
      }

      /* ===== RESPONSIF ===== */
      @media (max-width: 900px) {
        .top {
          padding: 0 14px;
          gap: 10px;
        }
        .levels {
          margin-left: 0;
        }
        .brand {
          font-size: 1rem;
        }
        .layout {
          flex-direction: column;
          align-items: stretch;
        }
        .side-nav {
          position: static;
          width: auto;
          height: auto;
          max-height: 260px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .wrap {
          padding: 0 14px 120px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        .brand span:not(.logo) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">한</span><span>K-Learning Platform</span>
      </div>
      <nav class="levels" id="levels"></nav>
    </header>

    <div class="layout">
      <aside class="side-nav">
        <button id="back">← Kembali</button>
        <div class="nav-t">Daftar Bagian</div>
        <div class="secs" id="secs"></div>
      </aside>

      <div class="wrap">
        <div class="head">
          <div>
            <h1 id="ttl"></h1>
            <p id="sub"></p>
          </div>
          <div class="tools">
            <input type="search" id="q" placeholder="Cari kalimat / arti…" />
            <button class="tg" data-h="ko">Sembunyikan Hangul</button>
            <button class="tg" data-h="rom">Sembunyikan Romanisasi</button>
            <button class="tg" data-h="id">Sembunyikan Arti</button>
            <button class="tg plain" id="todo">Belum hafal saja</button>
            <label class="rate"
              >Kecepatan
              <input
                type="range"
                id="rate"
                min=".5"
                max="1.2"
                step=".1"
                value=".8"
            /></label>
          </div>
        </div>
        <div class="stat">
          <div class="row"><span>Status Hafal</span><span id="pt"></span></div>
          <div class="prog"><i id="bar"></i></div>
        </div>
        <div id="list"></div>
      </div>
    </div>

    <div id="pop">
      <div><b id="pw"></b><span id="pm"></span></div>
      <button id="pp" title="Putar">🔊</button>
    </div>

    <script>
      // ===== DATA (dipisah per level & per jenis kalimat) =====
      const DATA = {
        dasar: { label: "Dasar (해요체)", sections: [] },
        menengah: { label: "Menengah-Atas", sections: [] },
      };
      const W = {};
      const add = (lv, t, items) => DATA[lv].sections.push({ t, items });
      const addW = (s) =>
        s
          .trim()
          .split("\n")
          .forEach((l) => {
            const i = l.indexOf("=");
            if (i > 0) W[l.slice(0, i).trim()] = l.slice(i + 1).trim();
          });

      // ---------- BAGIAN 1: DASAR · Salam, perkenalan, ungkapan sopan ----------
      add("dasar", "1a. Salam harian", [
        ["안녕하세요.", "annyeonghaseyo", "Halo / selamat pagi-siang-sore."],
        [
          "안녕하세요? 잘 지내세요?",
          "annyeonghaseyo? jal jinaeseyo?",
          "Halo, apa kabar?",
        ],
        ["네, 잘 지내요.", "ne, jal jinaeyo", "Ya, saya baik-baik saja."],
        ["오랜만이에요.", "oraenmanieyo", "Lama tidak bertemu."],
        ["만나서 반가워요.", "mannaseo bangawoyo", "Senang bertemu denganmu."],
        ["좋은 아침이에요.", "joeun achimieyo", "Selamat pagi."],
        [
          "안녕히 가세요.",
          "annyeonghi gaseyo",
          "Selamat jalan (kamu yang pergi).",
        ],
        [
          "안녕히 계세요.",
          "annyeonghi gyeseyo",
          "Selamat tinggal (aku yang pergi, kamu tetap).",
        ],
        ["잘 자요.", "jal jayo", "Selamat tidur."],
        ["내일 봐요.", "naeil bwayo", "Sampai jumpa besok."],
      ]);

      add("dasar", "1b. Perkenalan diri", [
        [
          "저는 [nama]이에요 / 예요.",
          "jeoneun [nama]ieyo / yeyo",
          "Saya [nama].",
        ],
        [
          "제 이름은 [nama]이에요.",
          "je ireumeun [nama]ieyo",
          "Nama saya [nama].",
        ],
        ["이름이 뭐예요?", "ireumi mwoyeyo", "Siapa namamu?"],
        [
          "저는 인도네시아 사람이에요.",
          "jeoneun indonesia saramieyo",
          "Saya orang Indonesia.",
        ],
        [
          "저는 반둥에서 왔어요.",
          "jeoneun bandungeseo wasseoyo",
          "Saya berasal dari Bandung.",
        ],
        ["어디에서 왔어요?", "eodieseo wasseoyo", "Kamu berasal dari mana?"],
        [
          "저는 학생이에요.",
          "jeoneun hakssaengieyo",
          "Saya pelajar / mahasiswa.",
        ],
        ["직업이 뭐예요?", "jigeobi mwoyeyo", "Pekerjaanmu apa?"],
        [
          "한국어를 공부하고 있어요.",
          "hangugeoreul gongbuhago isseoyo",
          "Saya sedang belajar bahasa Korea.",
        ],
        [
          "아직 한국어를 잘 못해요.",
          "ajik hangugeoreul jal mothaeyo",
          "Saya belum bisa bahasa Korea dengan baik.",
        ],
        [
          "천천히 말해 주세요.",
          "cheoncheonhi malhae juseyo",
          "Tolong bicara pelan-pelan.",
        ],
        [
          "다시 한번 말해 주세요.",
          "dasi hanbeon malhae juseyo",
          "Tolong katakan sekali lagi.",
        ],
        ["무슨 뜻이에요?", "museun tteusieyo", "Apa artinya?"],
        [
          "이해했어요. / 이해 못 했어요.",
          "ihaehaesseoyo / ihae mot haesseoyo",
          "Saya mengerti. / Saya tidak mengerti.",
        ],
        [
          "영어 할 수 있어요?",
          "yeongeo hal su isseoyo",
          "Bisa bahasa Inggris?",
        ],
      ]);

      add("dasar", "2. Ungkapan sopan sehari-hari", [
        ["감사합니다.", "gamsahamnida", "Terima kasih (formal)."],
        ["고마워요.", "gomawoyo", "Terima kasih (santai-sopan)."],
        ["정말 고마워요.", "jeongmal gomawoyo", "Terima kasih banyak."],
        ["천만에요.", "cheonmaneyo", "Sama-sama."],
        ["괜찮아요.", "gwaenchanayo", "Tidak apa-apa / baik-baik saja."],
        ["죄송합니다.", "joesonghamnida", "Mohon maaf (formal)."],
        ["미안해요.", "mianhaeyo", "Maaf."],
        ["실례합니다.", "sillyehamnida", "Permisi (mau lewat atau bertanya)."],
        ["잠깐만요.", "jamkkanmanyo", "Sebentar ya."],
        ["잠시만요.", "jamsimanyo", "Permisi sebentar (saat minta jalan)."],
        ["네. / 아니요.", "ne / aniyo", "Ya. / Tidak."],
        ["맞아요.", "majayo", "Benar."],
        ["잘 모르겠어요.", "jal moreugesseoyo", "Saya kurang tahu."],
        [
          "잘 먹겠습니다.",
          "jal meokgetseumnida",
          "Selamat makan (diucapkan sebelum makan).",
        ],
        [
          "잘 먹었습니다.",
          "jal meogeotseumnida",
          "Terima kasih atas makanannya (setelah makan).",
        ],
        [
          "수고하셨어요.",
          "sugohasyeosseoyo",
          "Terima kasih atas kerja kerasnya.",
        ],
        ["축하해요!", "chukahaeyo", "Selamat!"],
        ["조심하세요.", "josimhaseyo", "Hati-hati."],
        ["도와주세요.", "dowajuseyo", "Tolong bantu saya."],
        ["화이팅!", "hwaiting", "Semangat!"],
      ]);

      // ---------- KAMUS KATA (bagian 1) ----------
      addW(`안녕하세요=halo / selamat (sopan)
      
잘=dengan baik
지내세요=apakah Anda baik-baik (hormat)
네=ya
지내요=baik-baik saja
오랜만이에요=lama tidak bertemu
만나서=bertemu (lalu...)
반가워요=senang
좋은=bagus
아침이에요=(adalah) pagi
안녕히=dengan selamat
가세요=pergilah
계세요=tinggallah / tetap di sana
자요=tidur
내일=besok
봐요=lihat / bertemu
저는=saya (topik)
[nama]이에요=(adalah) [nama]
/=atau
예요=adalah
제=saya (milik)
이름은=nama (topik)
이름이=nama (subjek)
뭐예요=apa
인도네시아=Indonesia
사람이에요=(adalah) orang
반둥에서=dari Bandung
왔어요=sudah datang
어디에서=dari mana
학생이에요=(adalah) pelajar
직업이=pekerjaan
한국어를=bahasa Korea (objek)
공부하고=sedang belajar
있어요=ada / sedang
아직=masih / belum
못해요=tidak bisa
천천히=pelan-pelan
말해=bicara
주세요=tolong berikan
다시=lagi
한번=sekali
무슨=apa
뜻이에요=artinya
이해했어요=saya mengerti
이해=pengertian
못=tidak bisa
했어요=melakukan (lampau)
영어=bahasa Inggris
할=melakukan
수=kemungkinan (할 수 있어요 = bisa)
감사합니다=terima kasih (formal)
고마워요=terima kasih (santai-sopan)
정말=sungguh
천만에요=sama-sama
괜찮아요=tidak apa-apa
죄송합니다=mohon maaf (formal)
미안해요=maaf
실례합니다=permisi
잠깐만요=sebentar ya
잠시만요=permisi sebentar
아니요=tidak
맞아요=benar
모르겠어요=tidak tahu
먹겠습니다=akan makan (selamat makan)
먹었습니다=sudah makan
수고하셨어요=terima kasih atas kerja kerasnya
축하해요=selamat
조심하세요=hati-hati
도와주세요=tolong bantu
화이팅=semangat`);

      // ===== STATE =====
      const HOME = "index.html"; // ubah kalau halaman utamamu beda (dipakai tombol Kembali)
      const $ = (s) => document.querySelector(s),
        list = $("#list");
      const store = {
        get(k, d) {
          try {
            return JSON.parse(localStorage.getItem(k)) ?? d;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      let level = store.get("kv-level", "dasar"),
        sec = -1,
        onlyTodo = false,
        q = "";
      const done = new Set(store.get("kv-done", [])),
        hide = new Set(store.get("kv-hide", []));
      if (!DATA[level]) level = "dasar";

      // ===== AUDIO =====
      function speak(t) {
        if (!("speechSynthesis" in window))
          return alert("Browser kamu belum mendukung audio. Coba Chrome/Edge.");
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(
          String(t).replace(/\[.*?\]/g, ""),
        );
        u.lang = "ko-KR";
        u.rate = +$("#rate").value;
        const v = speechSynthesis
          .getVoices()
          .find((v) => v.lang.replace("_", "-").startsWith("ko"));
        if (v) u.voice = v;
        speechSynthesis.speak(u);
      }
      speechSynthesis.onvoiceschanged = () => {};

      // ===== RENDER =====
      function render() {
        const L = DATA[level];
        let html = "",
          tot = 0,
          ok = 0;

        // tombol level
        $("#levels").innerHTML = Object.entries(DATA)
          .map(
            ([k, v]) =>
              `<button class="lv ${k === level ? "on" : ""}" data-l="${k}">${esc(v.label)}</button>`,
          )
          .join("");

        // sidebar bagian
        const cnt = L.sections.map((s, si) => ({
          n: s.items.length,
          d: s.items.filter((_, ii) => done.has(level + si + "-" + ii)).length,
        }));
        $("#secs").innerHTML =
          `<button class="sec ${sec < 0 ? "on" : ""}" data-s="-1">Semua bagian</button>` +
          L.sections
            .map(
              (s, si) =>
                `<button class="sec ${si === sec ? "on" : ""} ${cnt[si].d === cnt[si].n && cnt[si].n ? "full" : ""}" data-s="${si}" title="${esc(s.t)}"><span>${esc(s.t)}</span><small>${cnt[si].d}/${cnt[si].n}</small></button>`,
            )
            .join("");

        // daftar kartu
        L.sections.forEach((s, si) => {
          if (sec >= 0 && si !== sec) return;
          let cards = "";
          s.items.forEach((it, ii) => {
            const k = level + si + "-" + ii,
              d = done.has(k);
            tot++;
            if (d) ok++;
            if (onlyTodo && d) return;
            if (q && !it.join(" ").toLowerCase().includes(q)) return;
            const words = String(it[0])
              .split(" ")
              .map(
                (w) =>
                  `<button class="w" data-w="${esc(w)}">${esc(w)}</button>`,
              )
              .join("");
            cards += `<article class="card ${d ? "done" : ""}" data-k="${k}" data-ko="${esc(it[0])}">
    <div class="ko" data-p="ko">${words}</div>
    <div class="rom" data-p="rom">${esc(it[1])}</div>
    <div class="id" data-p="id">${esc(it[2])}</div>
    <div class="side"><button class="btn-s ck" title="Tandai sudah hafal">${d ? "Hafal" : "Belum"}</button><button class="ib play" title="Putar kalimat">🔊</button><button class="ib eye" title="Sembunyikan arti kartu ini">🙈</button></div>
   </article>`;
          });
          if (cards)
            html += `<h2>${esc(s.t)}</h2><div class="grid">${cards}</div>`;
        });

        const empty = !L.sections.length
          ? "Data level ini masih kosong. Tempel add(...) dan addW(...) di bagian DATA."
          : "Tidak ada kalimat yang cocok.";
        list.innerHTML = html || `<p class="empty">${empty}</p>`;

        // judul & progress
        $("#ttl").textContent =
          L.label + (sec >= 0 ? " · " + L.sections[sec].t : " · Semua bagian");
        $("#sub").textContent =
          sec >= 0
            ? 'Klik "Kembali" untuk melihat semua bagian.'
            : L.sections.length + " bagian tersedia.";
        $("#bar").style.width = (tot ? (ok / tot) * 100 : 0) + "%";
        $("#pt").textContent =
          `${ok}/${tot} (${tot ? Math.round((ok / tot) * 100) : 0}%)`;

        document
          .querySelectorAll("[data-h]")
          .forEach((b) => b.classList.toggle("on", hide.has(b.dataset.h)));
        ["ko", "rom", "id"].forEach((h) =>
          document.body.classList.toggle("hide-" + h, hide.has(h)),
        );
      }

      // ===== EVENTS =====
      list.addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        const part = e.target.closest("[data-p]");
        if (
          part &&
          document.body.classList.contains("hide-" + part.dataset.p) &&
          !part.classList.contains("rev")
        ) {
          part.classList.add("rev");
          return;
        }
        if (
          part &&
          part.dataset.p === "id" &&
          card.classList.contains("hid-id")
        ) {
          card.classList.remove("hid-id");
          return;
        }
        if (e.target.closest(".eye")) {
          card.classList.toggle("hid-id");
          return;
        }
        if (e.target.closest(".play")) return speak(card.dataset.ko);
        if (e.target.closest(".ck")) {
          const k = card.dataset.k;
          done.has(k) ? done.delete(k) : done.add(k);
          store.set("kv-done", [...done]);
          return render();
        }
        const w = e.target.closest(".w");
        if (w) {
          const c = w.dataset.w.replace(/[.?!,]/g, "");
          $("#pw").textContent = c;
          $("#pm").textContent =
            W[c] || "Arti kata ini belum ada di kamus (tambahkan lewat addW).";
          $("#pop").classList.add("show");
          speak(c);
          clearTimeout(window.pt);
          window.pt = setTimeout(
            () => $("#pop").classList.remove("show"),
            6000,
          );
        }
      });
      $("#pp").onclick = () => speak($("#pw").textContent);
      $("#levels").onclick = (e) => {
        const l = e.target.dataset.l;
        if (l) {
          level = l;
          sec = -1;
          store.set("kv-level", l);
          render();
          scrollTo(0, 0);
        }
      };
      $("#secs").onclick = (e) => {
        const s = e.target.closest("[data-s]");
        if (s) {
          sec = +s.dataset.s;
          render();
          scrollTo(0, 0);
        }
      };
      $("#back").onclick = () => {
        if (sec >= 0) {
          sec = -1;
          render();
          scrollTo(0, 0);
        } else location.href = HOME;
      };
      $("#q").oninput = (e) => {
        q = e.target.value.toLowerCase();
        render();
      };
      $("#todo").onclick = (e) => {
        onlyTodo = !onlyTodo;
        e.target.classList.toggle("on", onlyTodo);
        render();
      };
      document.querySelectorAll("[data-h]").forEach(
        (b) =>
          (b.onclick = () => {
            const h = b.dataset.h;
            hide.has(h) ? hide.delete(h) : hide.add(h);
            store.set("kv-hide", [...hide]);
            render();
          }),
      );
      render();
    </script>
