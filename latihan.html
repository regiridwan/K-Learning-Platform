    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <style>
      :root {
        --bg-main: #0f172a;
        --panel-bg: #1e293b;
        --primary: #ffffff;
        --accent: #e11d48;
        --accent-hover: #be123c;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-muted: #94a3b8;
        --success: #10b981;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", "Noto Sans KR", sans-serif;
        background-color: var(--bg-main);
        color: var(--primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 0 32px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 1.15rem;
        color: var(--primary);
        text-decoration: none;
      }

      .brand-logo {
        background: linear-gradient(135deg, var(--accent), #f43f5e);
        color: white;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }

      nav a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: color 0.2s;
      }

      nav a:hover {
        color: var(--primary);
      }

      main {
        flex: 1;
        max-width: 850px;
        width: 100%;
        margin: 0 auto;
        padding: 32px 20px;
      }

      /* Selection Screen */
      .section-title {
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 8px;
        text-align: center;
      }

      .section-desc {
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 32px;
        font-size: 0.95rem;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }

      .category-card {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        padding: 20px;
        border-radius: 14px;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
      }

      .category-card:hover {
        border-color: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(225, 29, 72, 0.25);
      }

      .category-name {
        font-weight: 700;
        font-size: 1.1rem;
      }

      .category-count {
        font-size: 0.8rem;
        color: #f43f5e;
        background: rgba(244, 63, 94, 0.1);
        padding: 4px 10px;
        border-radius: 20px;
        display: inline-block;
        font-weight: 600;
      }

      /* Quiz Screen */
      .quiz-container {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 32px;
        display: none;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
      }

      .quiz-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-muted);
      }

      .quiz-progress {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--accent);
      }

      .question-box {
        text-align: center;
        margin: 30px 0 36px 0;
      }

      .question-kr {
        font-size: 2.8rem;
        font-weight: 800;
        color: var(--primary);
        letter-spacing: 0.02em;
        margin-bottom: 8px;
        font-family: "Noto Sans KR", sans-serif;
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 24px;
      }

      .option-btn {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-color);
        color: var(--primary);
        padding: 18px 20px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .option-btn:hover:not(:disabled) {
        border-color: var(--accent);
        background: rgba(225, 29, 72, 0.15);
      }

      .option-btn.correct {
        background: rgba(16, 185, 129, 0.2) !important;
        border-color: var(--success) !important;
        color: #6ee7b7 !important;
      }

      .option-btn.wrong {
        background: rgba(239, 68, 68, 0.2) !important;
        border-color: var(--danger) !important;
        color: #fca5a5 !important;
      }

      .audio-btn {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
      }

      .audio-btn:hover {
        background: var(--accent);
      }

      /* Result Screen */
      .result-box {
        text-align: center;
        display: none;
      }

      .score-circle {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(225, 29, 72, 0.15);
        border: 4px solid var(--accent);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px auto;
      }

      .score-num {
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--accent);
      }

      .score-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 700;
      }

      .result-stats {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 32px;
      }

      .stat-item {
        background: rgba(15, 23, 42, 0.6);
        padding: 12px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        min-width: 100px;
      }

      .stat-val {
        font-size: 1.3rem;
        font-weight: 700;
      }

      .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .btn-action {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn-action:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border-color);
        color: white;
      }

      footer {
        background: #090d16;
        border-top: 1px solid var(--border-color);
        padding: 20px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

        .options-grid {
          grid-template-columns: 1fr;
        }
        .question-kr {
          font-size: 2.2rem;
        }

    </style>
  </head>

        </div>

          <div class="question-kr" id="question-kr">한국어</div>
          <button class="audio-btn" onclick="speakCurrentQuestion()">
            🔊 Dengarkan
          </button>
        </div>

        <div class="options-grid" id="options-container"></div>
      </div>

      <!-- TAMPILAN 3: HASIL & SKOR -->

        <p
          style="color: var(--text-muted); margin-bottom: 24px"
          id="result-subtitle"
        >
          Hasil Latihan
        </p>

        <div class="score-circle">
          <div class="score-num" id="final-score">100</div>
          <div class="score-label">NILAI AKHIR</div>
        </div>

        <div class="result-stats">
          <div class="stat-item">
            <div style="color: var(--text-muted); font-size: 0.8rem">Benar</div>
            <div
              class="stat-val"
              style="color: var(--success)"
              id="stat-correct"
            >
              0
            </div>
          </div>
          <div class="stat-item">
            <div style="color: var(--text-muted); font-size: 0.8rem">Salah</div>
            <div class="stat-val" style="color: var(--danger)" id="stat-wrong">
              0
            </div>
          </div>
          <div class="stat-item">
            <div style="color: var(--text-muted); font-size: 0.8rem">
              Total Soal
            </div>
            <div class="stat-val" id="stat-total">0</div>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn-action btn-secondary" onclick="restartQuiz()">
            Ulangi Paket Ini
          </button>
          <button class="btn-action" onclick="showSelectionScreen()">
            Pilih Paket Lain
          </button>
        </div>
      </div>
    </main>

      const RAW_VOCAB_DATA = [];

      // Pengeruk Otomatis untuk format add(...)
      function add(level, category, items) {
        if (Array.isArray(items)) {
          items.forEach((item) => {
            if (Array.isArray(item) && item.length >= 3) {
              const kr = item[0].replace(/[.?!,;:"'“”‘’()]/g, "").trim();
              const id = item[2].trim();
              if (kr && id && !vocabMap.has(kr)) {
                vocabMap.set(kr, id);
                RAW_VOCAB_DATA.push({ kr, id });
              }
            }
          });
        }
      }

      // Pengeruk Otomatis untuk format addW(...)
      function addW(text) {
        if (typeof text === "string") {
          text
            .trim()
            .split("\n")
            .forEach((line) => {
              const eqIdx = line.indexOf("=");
              if (eqIdx > 0) {
                const kr = line.slice(0, eqIdx).trim();
                const id = line.slice(eqIdx + 1).trim();
                if (kr && id && !vocabMap.has(kr)) {
                  vocabMap.set(kr, id);
                  RAW_VOCAB_DATA.push({ kr, id });
                }
              }
            });
        }
      }

      // =========================================================================
      // STATE & LOGIKA KUIS
      // =========================================================================
      let selectedCategory = "Paket Latihan 1";
      let quizQuestions = [];
      let currentQuestionIdx = 0;
      let scoreCorrect = 0;
      let scoreWrong = 0;
      let isAnswered = false;

      window.onload = function () {
        renderSelectionScreen();
      };

      function renderSelectionScreen() {
        const container = document.getElementById("category-container");
        container.innerHTML = "";

        if (RAW_VOCAB_DATA.length === 0) {
          container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--text-muted)">Belum ada data kosakata yang dimuat.</p>`;
          return;
        }

        // Bagi seluruh kosakata menjadi paket-paket kuis (15 kata/paket)
        const CHUNK_SIZE = 15;
        const totalBatches = Math.ceil(RAW_VOCAB_DATA.length / CHUNK_SIZE);

        for (let i = 0; i < totalBatches; i++) {
          const batchItems = RAW_VOCAB_DATA.slice(
            i * CHUNK_SIZE,
            (i + 1) * CHUNK_SIZE,
          );
          const batchName = `Paket Latihan ${i + 1}`;

          const card = document.createElement("div");
          card.className = "category-card";
          card.innerHTML = `
            <div class="category-name">${batchName}</div>
            <div>
              <span class="category-count">${batchItems.length} Kosakata</span>
            </div>
          `;
          card.onclick = () => startQuiz(batchItems, batchName);
          container.appendChild(card);
        }
      }

      function speakCurrentQuestion() {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const item = quizQuestions[currentQuestionIdx];
          if (item) {
            const utterance = new SpeechSynthesisUtterance(item.kr);
            utterance.lang = "ko-KR";
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
          }
        }
      }

      function startQuiz(vocabList, titleName) {
        if (!vocabList || vocabList.length === 0) {
          alert("Tidak ada kosakata di paket ini.");
          return;
        }

        selectedCategory = titleName;

        // Acak urutan soal (Shuffle)
        quizQuestions = [...vocabList].sort(() => Math.random() - 0.5);

        currentQuestionIdx = 0;
        scoreCorrect = 0;
        scoreWrong = 0;

        document.getElementById("selection-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";

        document.getElementById("quiz-category-label").innerText =
          selectedCategory;

        renderQuestion();
      }

      function renderQuestion() {
        isAnswered = false;
        const currentItem = quizQuestions[currentQuestionIdx];
        const total = quizQuestions.length;

        document.getElementById("quiz-progress").innerText =
          `Soal ${currentQuestionIdx + 1} / ${total}`;
        document.getElementById("question-kr").innerText = currentItem.kr;

        // Putar suara secara otomatis
        speakCurrentQuestion();

        // Cari 3 pilihan jawaban salah dari seluruh database kosakata
        let pool = RAW_VOCAB_DATA.filter((item) => item.id !== currentItem.id);
        pool.sort(() => Math.random() - 0.5);

        let choices = [
          currentItem.id,
          ...pool.slice(0, 3).map((item) => item.id),
        ];
        choices.sort(() => Math.random() - 0.5);

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        choices.forEach((choiceText) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = choiceText;
          btn.onclick = () => handleAnswer(btn, choiceText, currentItem.id);
          optionsContainer.appendChild(btn);
        });
      }

      function handleAnswer(selectedBtn, selectedChoice, correctChoice) {
        if (isAnswered) return;
        isAnswered = true;

        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach((btn) => {
          btn.disabled = true;
          if (btn.innerText === correctChoice) {
            btn.classList.add("correct");
          }
        });

        if (selectedChoice === correctChoice) {
          scoreCorrect++;
        } else {
          scoreWrong++;
          selectedBtn.classList.add("wrong");
        }

        setTimeout(() => {
          currentQuestionIdx++;
          if (currentQuestionIdx < quizQuestions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 1200);
      }

      function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        const total = quizQuestions.length;
        const finalScore = Math.round((scoreCorrect / total) * 100);

        document.getElementById("result-subtitle").innerText =
          `Hasil ${selectedCategory}`;
        document.getElementById("final-score").innerText = finalScore;
        document.getElementById("stat-correct").innerText = scoreCorrect;
        document.getElementById("stat-wrong").innerText = scoreWrong;
        document.getElementById("stat-total").innerText = total;
      }

      function restartQuiz() {
        const CHUNK_SIZE = 15;
        const batchIndex =
          parseInt(selectedCategory.replace("Paket Latihan ", "")) - 1;
        const batchItems = RAW_VOCAB_DATA.slice(
          batchIndex * CHUNK_SIZE,
          (batchIndex + 1) * CHUNK_SIZE,
        );
        startQuiz(batchItems, selectedCategory);
      }

      function showSelectionScreen() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("selection-screen").style.display = "block";
      }
    </script>
  </body>
</html>
