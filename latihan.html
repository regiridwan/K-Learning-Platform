<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Kosakata - K-Learning Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #0f172a;
        --panel-bg: #1e293b;
        --primary: #ffffff;
        --accent: #e11d48;
        --accent-hover: #be123c;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-muted: #94a3b8;
        --success: #22c55e;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", "Noto Sans KR", sans-serif;
        background-color: var(--bg-main);
        color: var(--primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 0 32px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 1.25rem;
        color: var(--primary);
        text-decoration: none;
      }

      .brand-logo {
        background: linear-gradient(135deg, var(--accent), #f43f5e);
        color: white;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }

      nav a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: color 0.2s;
      }
      nav a:hover {
        color: var(--primary);
      }

      main {
        flex: 1;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        padding: 32px 24px;
      }

      /* Selection Screen */
      .section-title {
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 8px;
        text-align: center;
      }

      .section-desc {
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 32px;
        font-size: 0.95rem;
      }

      .phase-group {
        margin-bottom: 28px;
      }

      .phase-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border-color);
      }

      .weeks-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }

      .week-card {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        padding: 16px;
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .week-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(225, 29, 72, 0.2);
      }

      .week-name {
        font-weight: 700;
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .week-count {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      /* Quiz Screen */
      .quiz-container {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 32px;
        display: none;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
      }

      .quiz-title {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .quiz-progress {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--accent);
      }

      .question-box {
        text-align: center;
        margin: 36px 0 40px 0;
      }

      .question-kr {
        font-size: 2.6rem;
        font-weight: 800;
        color: var(--primary);
        letter-spacing: 0.02em;
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 24px;
      }

      .option-btn {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-color);
        color: var(--primary);
        padding: 18px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
      }

      .option-btn:hover {
        border-color: var(--accent);
        background: rgba(225, 29, 72, 0.1);
      }

      /* Result Screen */
      .result-box {
        text-align: center;
        display: none;
      }

      .score-circle {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(225, 29, 72, 0.15);
        border: 4px solid var(--accent);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px auto;
      }

      .score-num {
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--accent);
      }

      .score-label {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .result-stats {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-bottom: 32px;
      }

      .stat-item {
        background: rgba(15, 23, 42, 0.6);
        padding: 12px 20px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
      }

      .stat-val {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .btn-action {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn-action:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border-color);
        color: white;
      }

      footer {
        background: #090d16;
        border-top: 1px solid var(--border-color);
        padding: 20px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      @media (max-width: 600px) {
        .options-grid {
          grid-template-columns: 1fr;
        }
        .question-kr {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="welcome.html" class="brand">
        <div class="brand-logo">📝</div>
        <span>Latihan Kosakata</span>
      </a>
      <nav>
        <a href="welcome.html">← Kembali</a>
      </nav>
    </header>

    <main>
      <!-- TAMPILAN 1: PILIH MINGGU -->
      <div id="selection-screen">
        <h1 class="section-title">Pilih Minggu Latihan</h1>
        <p class="section-desc">
          Uji hafalan karakter Hangul dan kosakata kamu per minggu.
        </p>

        <div id="weeks-container"></div>
      </div>

      <!-- TAMPILAN 2: AREA KUIS MURNI HANGUL -->
      <div id="quiz-screen" class="quiz-container">
        <div class="quiz-header">
          <div class="quiz-title" id="quiz-week-label">Minggu 1</div>
          <div class="quiz-progress" id="quiz-progress">Soal 1 / 10</div>
        </div>

        <div class="question-box">
          <div class="question-kr" id="question-kr">안녕하세요</div>
        </div>

        <div class="options-grid" id="options-container"></div>
      </div>

      <!-- TAMPILAN 3: HASIL & SKOR -->
      <div id="result-screen" class="quiz-container result-box">
        <h2 style="font-size: 1.8rem; margin-bottom: 8px">
          Hasil Latihan Selesai! 🎉
        </h2>
        <p
          style="color: var(--text-muted); margin-bottom: 24px"
          id="result-week-subtitle"
        >
          Minggu 1
        </p>

        <div class="score-circle">
          <div class="score-num" id="final-score">100</div>
          <div class="score-label">NILAI AKHIR</div>
        </div>

        <div class="result-stats">
          <div class="stat-item">
            <div style="color: var(--text-muted); font-size: 0.8rem">Benar</div>
            <div
              class="stat-val"
              style="color: var(--success)"
              id="stat-correct"
            >
              0
            </div>
          </div>
          <div class="stat-item">
            <div style="color: var(--text-muted); font-size: 0.8rem">Salah</div>
            <div class="stat-val" style="color: var(--accent)" id="stat-wrong">
              0
            </div>
          </div>
          <div class="stat-item">
            <div style="color: var(--text-muted); font-size: 0.8rem">
              Total Soal
            </div>
            <div class="stat-val" id="stat-total">0</div>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn-action btn-secondary" onclick="restartQuiz()">
            Ulangi Minggu Ini
          </button>
          <button class="btn-action" onclick="showSelectionScreen()">
            Pilih Minggu Lain
          </button>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 K-Learning Platform. Master Hangul step-by-step!</p>
    </footer>

      // STATE KUIS
      let selectedWeek = "";
      let quizQuestions = [];
      let currentQuestionIdx = 0;
      let scoreCorrect = 0;
      let scoreWrong = 0;

      window.onload = function () {
        renderSelectionScreen();
      };

      function renderSelectionScreen() {
        const container = document.getElementById("weeks-container");
        container.innerHTML = "";

        Object.keys(phaseMapping).forEach((phaseTitle) => {
          const groupDiv = document.createElement("div");
          groupDiv.className = "phase-group";

          const title = document.createElement("div");
          title.className = "phase-title";
          title.innerText = phaseTitle;
          groupDiv.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "weeks-grid";

          phaseMapping[phaseTitle].forEach((week) => {
            const count = fullVocabData[week] ? fullVocabData[week].length : 0;
            const card = document.createElement("div");
            card.className = "week-card";
            card.innerHTML = `
            <div class="week-name">${week}</div>
            <div class="week-count">${count} Kosakata</div>
          `;
            card.onclick = () => startQuiz(week);
            grid.appendChild(card);
          });

          groupDiv.appendChild(grid);
          container.appendChild(groupDiv);
        });
      }

      function startQuiz(week) {
        selectedWeek = week;
        const vocabList = [...fullVocabData[week]];

        if (!vocabList || vocabList.length === 0) {
          alert("Kosakata untuk minggu ini belum tersedia.");
          return;
        }

        // Acak urutan soal (Shuffle)
        vocabList.sort(() => Math.random() - 0.5);
        quizQuestions = vocabList;

        currentQuestionIdx = 0;
        scoreCorrect = 0;
        scoreWrong = 0;

        document.getElementById("selection-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";

        document.getElementById("quiz-week-label").innerText =
          `Latihan: ${selectedWeek}`;

        renderQuestion();
      }

      function renderQuestion() {
        const currentItem = quizQuestions[currentQuestionIdx];
        const total = quizQuestions.length;

        document.getElementById("quiz-progress").innerText =
          `Soal ${currentQuestionIdx + 1} / ${total}`;
        document.getElementById("question-kr").innerText = currentItem.kr;

        // Buat pilihan jawaban (1 Benar + 3 Pengecoh)
        const currentWeekList = fullVocabData[selectedWeek];
        let wrongOptions = currentWeekList
          .filter((item) => item.id !== currentItem.id)
          .map((item) => item.id);

        // Acak pengecoh
        wrongOptions.sort(() => Math.random() - 0.5);

        // Ambil 3 pengecoh + 1 jawaban benar
        let choices = [currentItem.id, ...wrongOptions.slice(0, 3)];
        choices.sort(() => Math.random() - 0.5);

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        choices.forEach((choiceText) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = choiceText;
          btn.onclick = () => handleAnswer(choiceText, currentItem.id);
          optionsContainer.appendChild(btn);
        });
      }

      function handleAnswer(selectedChoice, correctChoice) {
        if (selectedChoice === correctChoice) {
          scoreCorrect++;
        } else {
          scoreWrong++;
        }

        currentQuestionIdx++;

        if (currentQuestionIdx < quizQuestions.length) {
          renderQuestion();
        } else {
          showResults();
        }
      }

      function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        const total = quizQuestions.length;
        const finalScore = Math.round((scoreCorrect / total) * 100);

        document.getElementById("result-week-subtitle").innerText =
          `Hasil Latihan ${selectedWeek}`;
        document.getElementById("final-score").innerText = finalScore;
        document.getElementById("stat-correct").innerText = scoreCorrect;
        document.getElementById("stat-wrong").innerText = scoreWrong;
        document.getElementById("stat-total").innerText = total;
      }

      function restartQuiz() {
        startQuiz(selectedWeek);
      }

      function showSelectionScreen() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("selection-screen").style.display = "block";
      }
