<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break Time Zone - K-Learning Platform</title>
    <!-- Favicon / Logo Tab Browser (SVG Inline) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e11d48'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='white' font-size='60' font-family='sans-serif' font-weight='bold'>한</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #0f172a;
        --panel-bg: #1e293b;
        --primary: #ffffff;
        --accent: #e11d48;
        --accent-hover: #be123c;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-main);
        color: var(--primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Header Navigasi */
      header {
        width: 100%;
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 0 32px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 1.25rem;
        color: var(--primary);
        text-decoration: none;
      }

      .brand-logo {
        background: linear-gradient(135deg, var(--accent), #f43f5e);
        color: white;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }

      nav a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: color 0.2s;
      }

      nav a:hover {
        color: var(--primary);
      }

      /* Game Container */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        width: 100%;
        max-width: 600px;
      }

      .game-card {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 28px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .game-header {
        text-align: center;
        margin-bottom: 20px;
      }

      .game-title {
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 6px;
      }

      .game-subtitle {
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .stats-bar {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 400px;
        background: rgba(15, 23, 42, 0.6);
        padding: 10px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 20px;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .stats-bar span {
        color: var(--accent);
      }

      /* Grid Kartu untuk Tablet/HP */
      .grid-board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 420px;
        perspective: 1000px;
      }

      .card {
        aspect-ratio: 1 / 1;
        background: #0f172a;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          border-color 0.2s ease,
          background-color 0.2s ease;
        touch-action: manipulation;
      }

      .card:active {
        transform: scale(0.95);
      }

      .card.flipped {
        background: #1e293b;
        border-color: var(--accent);
        transform: rotateY(180deg);
      }

      .card.matched {
        background: rgba(34, 197, 94, 0.15);
        border-color: #22c55e;
        cursor: default;
        opacity: 0.8;
      }

      .btn-restart {
        margin-top: 24px;
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .btn-restart:hover {
        background: var(--accent-hover);
      }

      .btn-restart:active {
        transform: scale(0.97);
      }

      footer {
        padding: 20px;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      @media (max-width: 480px) {
        .card {
          font-size: 1.8rem;
        }
        .grid-board {
          gap: 8px;
        }
        .game-card {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="brand">
        <div class="brand-logo">🎮</div>
        <span>Break Time Zone</span>
      </a>
      <nav>
        <a href="modul.html">← Kembali Belajar</a>
      </nav>
    </header>

    <main>
      <div class="game-card">
        <div class="game-header">
          <h1 class="game-title">🃏 Memory Icon Flip</h1>
          <p class="game-subtitle">
            Klik kartu untuk mencari pasangan gambar yang sama!
          </p>
        </div>

        <div class="stats-bar">
          <div>Langkah: <span id="move-count">0</span></div>
          <div>Pasangan: <span id="match-count">0 / 8</span></div>
        </div>

        <!-- Area 16 Kartu (4x4 Grid) -->
        <div class="grid-board" id="board"></div>

        <button class="btn-restart" onclick="initGame()">
          Acak & Main Lagi
        </button>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 K-Learning Platform. Refresh your mind!</p>
    </footer>

    <script>
      const icons = ["🍕", "🚀", "☕", "🎧", "⚽", "🎨", "🚲", "🍿"];
      let cardsData = [];
      let flippedCards = [];
      let moves = 0;
      let matches = 0;
      let isLockBoard = false;

      function initGame() {
        const board = document.getElementById("board");
        board.innerHTML = "";

        // Duplikasi ikon agar jadi 8 pasang (16 kartu)
        cardsData = [...icons, ...icons];

        // Acak urutan kartu (Shuffle)
        cardsData.sort(() => Math.random() - 0.5);

        moves = 0;
        matches = 0;
        flippedCards = [];
        isLockBoard = false;

        document.getElementById("move-count").innerText = moves;
        document.getElementById("match-count").innerText =
          `${matches} / ${icons.length}`;

        // Buat elemen kartu di DOM
        cardsData.forEach((icon, index) => {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.icon = icon;
          card.dataset.index = index;
          card.innerText = "❓"; // Tampilan belakang kartu

          // Event Sentuh / Klik tablet
          card.addEventListener("click", () => flipCard(card));

          board.appendChild(card);
        });
      }

      function flipCard(card) {
        if (
          isLockBoard ||
          card.classList.contains("flipped") ||
          card.classList.contains("matched")
        ) {
          return;
        }

        card.classList.add("flipped");
        card.innerText = card.dataset.icon;
        flippedCards.push(card);

        if (flippedCards.length === 2) {
          moves++;
          document.getElementById("move-count").innerText = moves;
          checkMatch();
        }
      }

      function checkMatch() {
        const [card1, card2] = flippedCards;
        const isMatch = card1.dataset.icon === card2.dataset.icon;

        if (isMatch) {
          card1.classList.add("matched");
          card2.classList.add("matched");
          matches++;
          document.getElementById("match-count").innerText =
            `${matches} / ${icons.length}`;
          flippedCards = [];

          if (matches === icons.length) {
            setTimeout(() => {
              alert(
                `🎉 Selamat! Kamu menyelesaikan game dalam ${moves} langkah.`,
              );
            }, 300);
          }
        } else {
          isLockBoard = true;
          setTimeout(() => {
            card1.classList.remove("flipped");
            card2.classList.remove("flipped");
            card1.innerText = "❓";
            card2.innerText = "❓";
            flippedCards = [];
            isLockBoard = false;
          }, 800);
        }
      }

      // Jalankan game saat halaman dimuat
      window.onload = initGame;
    </script>
  </body>
</html>
