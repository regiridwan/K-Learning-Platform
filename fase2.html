<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fase 2: Perluasan - K-Learning Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #f8fafc;
        --panel-bg: #ffffff;
        --primary: #1e293b;
        --accent: #e11d48;
        --border-color: #e2e8f0;
        --text-muted: #64748b;
        --text-main: #1e293b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", "Noto Sans KR", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: var(--panel-bg);
        border-bottom: 1px solid var(--border-color);
        padding: 0 24px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--primary);
        text-decoration: none;
      }

      .brand-logo {
        background: var(--accent);
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      nav {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      nav a {
        text-decoration: none;
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.9rem;
      }
      nav a:hover {
        color: var(--accent);
      }

      .nav-dropdown {
        padding: 6px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        background: white;
        color: var(--primary);
        outline: none;
        cursor: pointer;
      }

      .timer-widget {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f1f5f9;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
      }

      .timer-display {
        font-family: monospace;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--primary);
      }

      .timer-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .timer-btn.stop {
        background: var(--accent);
      }

      .workspace {
        display: flex;
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      .left-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-color);
        background: #ffffff;
        transition: all 0.3s ease;
      }

      .panel-header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f8fafc;
      }

      .pdf-container {
        flex: 1;
        background: #525659;
      }
      .pdf-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Panel Kanan (Kosakata) & Fitur Collapse */
      .right-panel {
        width: 400px;
        background: var(--panel-bg);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition:
          margin-right 0.3s ease,
          opacity 0.2s ease;
      }

      .right-panel.collapsed {
        margin-right: -400px;
        opacity: 0;
        pointer-events: none;
      }

      .vocab-header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .vocab-title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .vocab-title {
        font-size: 1rem;
        font-weight: 700;
      }

      .control-btns {
        display: flex;
        gap: 6px;
      }

      .action-btn {
        font-size: 0.75rem;
        padding: 5px 10px;
        background: #f1f5f9;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        color: var(--primary);
        transition: all 0.2s;
      }

      .action-btn:hover {
        background: var(--primary);
        color: white;
      }

      .toggle-panel-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background-color 0.2s;
      }

      .toggle-panel-btn:hover {
        background: var(--accent);
      }

      .week-filter {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .week-btn {
        padding: 4px 12px;
        border: 1px solid var(--border-color);
        background: #f1f5f9;
        border-radius: 16px;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }

      .week-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .vocab-list {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .vocab-card {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: #ffffff;
        transition: background-color 0.2s;
      }
      .vocab-card:hover {
        background-color: #f8fafc;
      }

      .vocab-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .vocab-kr {
        font-weight: 700;
        font-size: 0.98rem;
        color: var(--primary);
      }

      .vocab-latin {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 600;
        font-style: italic;
      }

      .vocab-id {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .blur-text {
        background: #cbd5e1;
        color: transparent !important;
        border-radius: 4px;
        user-select: none;
        display: inline-block;
        padding: 0 4px;
      }

      .item-toggle-btn {
        background: #f1f5f9;
        border: 1px solid var(--border-color);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.85rem;
        flex-shrink: 0;
        transition: background-color 0.2s;
      }

      .item-toggle-btn:hover {
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="welcome.html" class="brand">
        <div class="brand-logo">한</div>
        <span>K-Learning Platform</span>
      </a>

      <div class="timer-widget">
        <span
          style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600"
          >POMODORO</span
        >
        <div class="timer-display" id="timer">25:00</div>
        <button class="timer-btn" id="start-timer-btn" onclick="toggleTimer()">
          Start
        </button>
        <button
          class="timer-btn"
          onclick="resetTimer()"
          style="background: #cbd5e1; color: #334155"
        >
          Reset
        </button>
      </div>

      <nav>
        <select
          class="nav-dropdown"
          onchange="window.location.href = this.value"
        >
          <option value="fase1.html">Fase 1: Fondasi</option>
          <option value="fase2.html" selected>Fase 2: Perluasan</option>
          <option value="fase3.html">Fase 3: Kalimat Kompleks</option>
          <option value="fase4.html">Fase 4: Tata Bahasa Lanjutan</option>
          <option value="fase5.html">Fase 5: Simulasi TOPIK I</option>
          <option value="fase6.html">Fase 6: Menengah Awal</option>
          <option value="fase7.html">Fase 7: TOPIK II</option>
        </select>
        <a href="welcome.html">Home</a>
      </nav>
    </header>

    <div class="workspace">
      <!-- Panel Kiri: Modul PDF -->
      <div class="left-panel">
        <div class="panel-header">
          <span style="font-weight: 700; color: var(--primary)"
            >Fase 2: Perluasan (Minggu 5 - 8)</span
          >
          <button
            class="toggle-panel-btn"
            onclick="toggleRightPanel()"
            id="toggle-panel-btn"
          >
            <span id="panel-btn-icon">📖</span>
            <span id="panel-btn-text">Sembunyikan Kosakata</span>
          </button>
        </div>
        <div class="pdf-container">
          <iframe
            src="https://docs.google.com/viewer?url=https://k-learning-platform-by-regi.netlify.app/Modul_Bahasa_Korea_Fase2.pdf&embedded=true"
          ></iframe>
        </div>
      </div>

      <!-- Panel Kanan: Kuis & Hafalan Kosakata -->
      <div class="right-panel" id="right-panel">
        <div class="vocab-header">
          <div class="vocab-title-bar">
            <span class="vocab-title">Hafalan Kosakata</span>
            <div class="control-btns">
              <button class="action-btn" onclick="toggleHideTarget()">
                Mode:
                <span id="hide-mode-label" style="color: var(--accent)"
                  >Sembunyi ID</span
                >
              </button>
              <button class="action-btn" onclick="toggleHideAll()">
                Sembunyi Semua
              </button>
            </div>
          </div>
          <div class="week-filter" id="week-filter-container"></div>
        </div>
        <div class="vocab-list" id="vocab-list"></div>
      </div>
    </div>

    <script>
      const vocabData = {
        "Minggu 5": [
          { kr: "지금", latin: "ji-geum", id: "Sekarang" },
          { kr: "일어나다", latin: "i-reo-na-da", id: "Bangun" },
          { kr: "몇", latin: "myeot", id: "Berapa" },
          { kr: "점심", latin: "jeom-sim", id: "Makan siang" },
          { kr: "시", latin: "si", id: "Jam (penghitung)" },
          { kr: "수업", latin: "su-eop", id: "Kelas/pelajaran" },
          { kr: "분", latin: "bun", id: "Menit" },
          { kr: "시작하다", latin: "si-jak-ha-da", id: "Mulai" },
          { kr: "반", latin: "ban", id: "Setengah" },
          { kr: "끝나다", latin: "kkeut-na-da", id: "Selesai" },
          { kr: "오전", latin: "o-jeon", id: "Sebelum tengah hari" },
          { kr: "~부터", latin: "~bu-teo", id: "Dari (waktu)" },
          { kr: "오후", latin: "o-hu", id: "Sesudah tengah hari" },
          { kr: "~까지", latin: "~kka-ji", id: "Sampai" },
          { kr: "무슨 요일", latin: "mu-seun yo-il", id: "Hari apa" },
        ],
        "Minggu 6": [
          { kr: "여행", latin: "yeo-haeng", id: "Perjalanan/wisata" },
          { kr: "청소하다", latin: "cheong-so-ha-da", id: "Membersihkan" },
          { kr: "영화관", latin: "yeong-hwa-gwan", id: "Bioskop" },
          { kr: "전화하다", latin: "jeon-hwa-ha-da", id: "Menelepon" },
          { kr: "선물", latin: "seon-mul", id: "Hadiah" },
          { kr: "재미있다", latin: "jae-mi-it-da", id: "Seru/menarik" },
          { kr: "사진", latin: "sa-jin", id: "Foto" },
          { kr: "맛있다", latin: "ma-sit-da", id: "Enak" },
          { kr: "날씨", latin: "nal-ssi", id: "Cuaca" },
          { kr: "좋다", latin: "jo-ta", id: "Bagus/baik" },
          { kr: "비행기", latin: "bi-haeng-gi", id: "Pesawat" },
          { kr: "힘들다", latin: "him-deul-da", id: "Berat/lelah" },
          { kr: "산책하다", latin: "san-chaek-ha-da", id: "Berjalan santai" },
          { kr: "너무", latin: "neo-mu", id: "Terlalu/sangat" },
          { kr: "요리하다", latin: "yo-ri-ha-da", id: "Memasak" },
        ],
        "Minggu 7": [
          { kr: "계획", latin: "gye-hoek", id: "Rencana" },
          { kr: "이번 주말", latin: "i-beon ju-mal", id: "Akhir pekan ini" },
          { kr: "여행", latin: "yeo-haeng", id: "Perjalanan" },
          { kr: "아무것도", latin: "a-mu-geot-do", id: "Apa pun (negatif)" },
          { kr: "방학", latin: "bang-hak", id: "Libur sekolah" },
          { kr: "놀다", latin: "nol-da", id: "Bermain" },
          { kr: "휴가", latin: "hyu-ga", id: "Cuti" },
          { kr: "살다", latin: "sal-da", id: "Tinggal" },
          { kr: "모레", latin: "mo-re", id: "Lusa" },
          { kr: "배우다", latin: "bae-u-da", id: "Belajar (keterampilan)" },
          { kr: "다음 주", latin: "da-eum ju", id: "Minggu depan" },
          { kr: "준비하다", latin: "jun-bi-ha-da", id: "Menyiapkan" },
          { kr: "다음 달", latin: "da-eum dal", id: "Bulan depan" },
          { kr: "기다리다", latin: "gi-da-ri-da", id: "Menunggu" },
          { kr: "내년", latin: "nae-nyeon", id: "Tahun depan" },
        ],
        "Minggu 8": [
          { kr: "어서 오세요", latin: "eo-seo o-se-yo", id: "Selamat datang" },
          { kr: "비빔밥", latin: "bi-bim-bap", id: "Bibimbap" },
          {
            kr: "뭐 드릴까요?",
            latin: "mwo deu-ril-kka-yo?",
            id: "Mau pesan apa?",
          },
          { kr: "김치찌개", latin: "gim-chi-jji-gae", id: "Kimchi jjigae" },
          {
            kr: "알겠습니다",
            latin: "al-ges-seum-ni-da",
            id: "Baik, dimengerti",
          },
          { kr: "불고기", latin: "bul-go-gi", id: "Bulgogi" },
          { kr: "여기요", latin: "yeo-gi-yo", id: "Permisi (memanggil)" },
          { kr: "냉면", latin: "naeng-myeon", id: "Naengmyeon" },
          {
            kr: "맛있게 드세요",
            latin: "ma-sit-ge deu-se-yo",
            id: "Selamat makan",
          },
          { kr: "김밥", latin: "gim-bap", id: "Gimbap" },
          { kr: "메뉴", latin: "me-nyu", id: "Menu" },
          { kr: "떡볶이", latin: "tteok-bok-ki", id: "Tteokbokki" },
          { kr: "주문하다", latin: "ju-mun-ha-da", id: "Memesan" },
          { kr: "더", latin: "deo", id: "Lagi/lebih" },
          { kr: "계산하다", latin: "gye-san-ha-da", id: "Membayar" },
          { kr: "같이", latin: "ga-chi", id: "Bersama" },
          { kr: "카드", latin: "ka-deu", id: "Kartu" },
          { kr: "우리", latin: "u-ri", id: "Kita" },
          { kr: "현금", latin: "hyeon-geum", id: "Uang tunai" },
          { kr: "괜찮아요", latin: "gwaen-cha-na-yo", id: "Tidak apa-apa" },
        ],
      };

      let currentWeek = Object.keys(vocabData)[0];
      let hideTarget = "ID";
      let hideStates = {};
      let isPanelCollapsed = false;

      window.onload = function () {
        const weekContainer = document.getElementById("week-filter-container");
        Object.keys(vocabData).forEach((week, index) => {
          const btn = document.createElement("button");
          btn.className = `week-btn ${index === 0 ? "active" : ""}`;
          btn.innerText = week;
          btn.onclick = () => selectWeek(week, btn);
          weekContainer.appendChild(btn);
        });
        renderVocab();
      };

      function toggleRightPanel() {
        const rightPanel = document.getElementById("right-panel");
        const btnIcon = document.getElementById("panel-btn-icon");
        const btnText = document.getElementById("panel-btn-text");

        isPanelCollapsed = !isPanelCollapsed;

        if (isPanelCollapsed) {
          rightPanel.classList.add("collapsed");
          btnIcon.innerText = "📖";
          btnText.innerText = "Tampilkan Kosakata";
        } else {
          rightPanel.classList.remove("collapsed");
          btnIcon.innerText = "📖";
          btnText.innerText = "Sembunyikan Kosakata";
        }
      }

      function selectWeek(week, btnElement) {
        document
          .querySelectorAll(".week-btn")
          .forEach((b) => b.classList.remove("active"));
        btnElement.classList.add("active");
        currentWeek = week;
        hideStates = {};
        renderVocab();
      }

      function toggleHideTarget() {
        hideTarget = hideTarget === "ID" ? "KR" : "ID";
        document.getElementById("hide-mode-label").innerText =
          hideTarget === "ID" ? "Sembunyi ID" : "Sembunyi KR";
        renderVocab();
      }

      function toggleSingleItem(index) {
        hideStates[index] = !hideStates[index];
        renderVocab();
      }

      function toggleHideAll() {
        const currentList = vocabData[currentWeek];
        const allHidden = currentList.every((_, idx) => hideStates[idx]);

        currentList.forEach((_, idx) => {
          hideStates[idx] = !allHidden;
        });
        renderVocab();
      }

      function renderVocab() {
        const vocabList = document.getElementById("vocab-list");
        vocabList.innerHTML = "";

        vocabData[currentWeek].forEach((item, index) => {
          const isHidden = hideStates[index] || false;

          const isKrHidden = isHidden && hideTarget === "KR";
          const isIdHidden = isHidden && hideTarget === "ID";

          const card = document.createElement("div");
          card.className = "vocab-card";
          card.innerHTML = `
          <div class="vocab-content">
            <div class="vocab-kr ${isKrHidden ? "blur-text" : ""}">${item.kr}</div>
            <div class="vocab-latin ${isKrHidden ? "blur-text" : ""}">${item.latin}</div>
            <div class="vocab-id ${isIdHidden ? "blur-text" : ""}">${item.id}</div>
          </div>
          <button class="item-toggle-btn" onclick="toggleSingleItem(${index})" title="Sembunyikan/Tampilkan Item Ini">
            ${isHidden ? "👁️" : "🙈"}
          </button>
        `;
          vocabList.appendChild(card);
        });
      }

      /* Timer Functions */
      let timerInterval = null,
        timeLeft = 25 * 60,
        isTimerRunning = false;
      function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60),
          seconds = timeLeft % 60;
        document.getElementById("timer").innerText =
          `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
      }
      function toggleTimer() {
        const btn = document.getElementById("start-timer-btn");
        if (isTimerRunning) {
          clearInterval(timerInterval);
          isTimerRunning = false;
          btn.innerText = "Start";
          btn.classList.remove("stop");
        } else {
          isTimerRunning = true;
          btn.innerText = "Pause";
          btn.classList.add("stop");
          timerInterval = setInterval(() => {
            if (timeLeft > 0) {
              timeLeft--;
              updateTimerDisplay();
            } else {
              clearInterval(timerInterval);
              alert("Waktu belajar selesai! Istirahat dulu.");
              resetTimer();
            }
          }, 1000);
        }
      }
      function resetTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        timeLeft = 25 * 60;
        document.getElementById("start-timer-btn").innerText = "Start";
        document.getElementById("start-timer-btn").classList.remove("stop");
        updateTimerDisplay();
      }
      updateTimerDisplay();
    </script>
  </body>
</html>
